<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雾镜</title>
<style>
  :root {
    --ink: #f4f6f8;
    --ink-soft: rgba(244, 246, 248, 0.76);
    --ink-faint: rgba(244, 246, 248, 0.5);
    --card: rgba(22, 26, 31, 0.5);
    --line: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0e1013;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 镜子：铺满整个窗口的画布 */
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* 水珠、往下流的水珠：画在镜子上面一层透明画布上，不挡鼠标擦雾 */
  .water { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }

  /* 摄像头的原始画面只给程序读，不给人看。
     不能用 display:none 完全藏起来，否则有的浏览器会停止更新画面。 */
  #cam { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }

  /* ---------- 开始页、出错页（永远在最上面） ---------- */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    padding: 24px 16px;
    overflow-y: auto;
    background:
      radial-gradient(70vmax 55vmax at 28% 22%, rgba(255, 255, 255, 0.14), transparent 70%),
      radial-gradient(60vmax 50vmax at 78% 82%, rgba(160, 182, 204, 0.16), transparent 70%),
      linear-gradient(160deg, #2c3239, #121519);
    transition: opacity 0.6s ease, visibility 0s linear 0s;
  }
  .screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.6s ease, visibility 0s linear 0.6s;
  }
  .card {
    margin: auto;
    width: 100%;
    max-width: 440px;
    padding: 44px 28px 36px;
    text-align: center;
    border-radius: 26px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  h1 {
    margin: 0 0 14px;
    font-size: 46px;
    font-weight: 300;
    letter-spacing: 0.32em;
    text-indent: 0.32em; /* 抵消最后一个字后面多出来的字距，让标题看起来居中 */
  }
  .lead { margin: 0 0 30px; font-size: 17px; line-height: 1.7; color: var(--ink-soft); }
  .btn {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 14px 46px;
    font: inherit;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.18em;
    background: #fff;
    color: #15181c;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.6; cursor: default; transform: none; letter-spacing: 0.04em; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .note { margin: 24px 0 0; font-size: 13px; line-height: 1.7; color: var(--ink-faint); }

  /* 出错页直接出现、直接消失，不和开始页叠在一起淡入淡出 */
  #problem, #problem.hidden { transition: none; }
  .problem { max-width: 540px; text-align: left; }
  .problem h2 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
  .problem p { margin: 0 0 10px; line-height: 1.7; color: var(--ink-soft); }
  .problem .step-title { margin: 18px 0 6px; color: var(--ink); font-weight: 600; }
  .problem ol { margin: 0; padding-left: 1.4em; line-height: 1.85; color: var(--ink-soft); }
  .problem ol + p { margin-top: 16px; }
  .problem b { color: var(--ink); }
  .problem .small { font-size: 13px; color: var(--ink-faint); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .actions .btn { padding: 12px 28px; font-size: 16px; letter-spacing: 0.06em; }

  /* ---------- 屏幕底部中间：小提示 + 小圆圈（竖着排，提示在上） ---------- */
  .bottom {
    position: fixed;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: min(760px, calc(100% - 32px));
    pointer-events: none; /* 空白的地方不挡鼠标擦雾 */
  }
  .hint {
    max-width: 100%;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 14px;
    text-align: center;
    color: rgba(255, 255, 255, 0.92);
    background: rgba(10, 12, 15, 0.42);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: opacity 0.8s ease;
  }
  .hint.hidden { opacity: 0; }
  .hint.dim { opacity: 0.5; }

  /* ---------- 底部中间的小圆圈：点一下弹出小气泡（雾的浓度、擦痕粗细、重新校准、清除所有雾），再点一下收起 ---------- */
  .menu {
    position: relative;
    pointer-events: auto;
    transition: opacity 0.4s ease;
  }
  .menu.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .menu-btn {
    appearance: none;
    -webkit-appearance: none;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 50%;
    color: rgba(255, 255, 255, 0.95);
    background: rgba(10, 12, 15, 0.42);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .menu-btn:hover { background: rgba(10, 12, 15, 0.6); }
  .menu.open .menu-btn { color: #15181c; background: rgba(255, 255, 255, 0.92); }
  .menu-panel { /* 小气泡：从圆圈上面弹出来，只占屏幕下面一小块 */
    position: absolute;
    left: 50%;
    bottom: calc(100% + 14px);
    width: min(320px, calc(100vw - 32px));
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 18px 16px;
    border-radius: 20px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.92);
    background: rgba(10, 12, 15, 0.6);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    opacity: 0;
    visibility: hidden;
    transform: translateX(-50%) translateY(10px) scale(0.92);
    transform-origin: 50% 100%;
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s linear 0.18s;
  }
  .menu-panel::after { /* 气泡下面的小尖角，指着圆圈 */
    content: '';
    position: absolute;
    left: 50%;
    top: 100%;
    margin-left: -8px;
    border: 8px solid transparent;
    border-top-color: rgba(10, 12, 15, 0.6);
  }
  .menu.open .menu-panel {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .bottom.menu-open .hint { opacity: 0; transition-duration: 0.15s; } /* 气泡会盖到提示的位置：打开时先把提示藏起来 */
  .slider { display: flex; align-items: center; gap: 12px; min-width: 0; cursor: pointer; }
  .slider span { min-width: 5em; white-space: nowrap; } /* 名字一样宽，几个滑条才对得齐 */
  .slider output { min-width: 3.6em; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .menu-note { margin-top: 2px; font-size: 12px; text-align: center; color: rgba(255, 255, 255, 0.55); }
  .menu-actions { display: flex; gap: 10px; margin-top: 4px; }
  .menu-action {
    appearance: none;
    -webkit-appearance: none;
    flex: 1;
    padding: 8px 10px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 999px;
    font: inherit;
    font-size: 13px;
    white-space: nowrap;
    color: rgba(255, 255, 255, 0.92);
    background: transparent;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }
  .menu-action:hover { background: rgba(255, 255, 255, 0.12); }
  /* 小气泡里的开关（辅助书写）：真正的勾选框藏起来，旁边画一个滑动开关 */
  .switch-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  .switch-row small { display: block; margin-top: 2px; font-size: 12px; color: rgba(255, 255, 255, 0.6); }
  .switch-row input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .switch {
    flex: none;
    position: relative;
    width: 40px;
    height: 24px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.25);
    transition: background-color 0.2s ease, box-shadow 0.2s ease;
  }
  .switch::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    transition: transform 0.2s ease;
  }
  .switch-row input:checked + .switch { background: rgba(126, 226, 168, 0.95); }
  .switch-row input:checked + .switch::after { transform: translateX(16px); }
  .switch-row input:focus-visible + .switch { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35); }
  /* 小气泡里的「擦雾手势」：两个按钮选一个 */
  .mode-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .seg { display: flex; padding: 2px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); }
  .seg button {
    appearance: none;
    -webkit-appearance: none;
    padding: 5px 12px;
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.75);
    background: transparent;
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .seg button.on { color: #15181c; background: rgba(255, 255, 255, 0.92); }
  .slider input {
    --fill: 60%;
    flex: 1;
    min-width: 0;
    height: 24px;
    margin: 0;
    background: transparent;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .slider input:focus { outline: none; }
  .slider input::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, #fff var(--fill), rgba(255, 255, 255, 0.28) var(--fill));
  }
  .slider input::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    margin-top: -7px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
    transition: transform 0.15s ease;
  }
  .slider input:active::-webkit-slider-thumb { transform: scale(1.15); }
  .slider input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3); }
  .slider input::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.28); }
  .slider input::-moz-range-progress { height: 4px; border-radius: 2px; background: #fff; }
  .slider input::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35); }

  /* 调擦痕粗细时，屏幕中间出现一个和擦痕一样粗的圆 */
  .brush-preview {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 3;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25), inset 0 0 0 1px rgba(0, 0, 0, 0.15);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .brush-preview.show { opacity: 1; }

  /* ---------- 手掌张开在雾上抹：一个淡淡的圆圈，圈住正在慢慢擦淡的那一片（和手一样大） ---------- */
  .palm-zone {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 3;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    box-shadow: inset 0 0 24px rgba(255, 255, 255, 0.16), 0 0 10px rgba(0, 0, 0, 0.12);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
    will-change: transform;
  }
  .palm-zone.show { opacity: 1; }

  /* ---------- 录屏中的小标记（右上角，不会录进视频里）；截屏时屏幕白闪一下 ---------- */
  .rec-badge {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: #fff;
    background: rgba(10, 12, 15, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    pointer-events: none;
  }
  .rec-badge::before {
    content: '';
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff4d4f;
    animation: rec-blink 1s ease-in-out infinite;
  }
  @keyframes rec-blink { 50% { opacity: 0.25; } }
  .rec-badge.hidden { display: none; }
  .flash { position: fixed; inset: 0; z-index: 6; background: #fff; pointer-events: none; opacity: 0; transition: opacity 0.35s ease-out; }
  .flash.on { opacity: 0.55; transition: none; }

  /* ---------- 手势的笔尖：没捏时空心，捏住时实心 ---------- */
  .pen {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 3;
    width: 22px;
    height: 22px;
    margin: -11px 0 0 -11px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25), 0 2px 8px rgba(0, 0, 0, 0.3);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease, background-color 0.12s ease;
    will-change: transform;
  }
  .pen.show { opacity: 1; }
  .pen.pinch { background-color: rgba(255, 255, 255, 0.9); }

  /* ---------- 辅助书写：指尖（小圆圈）用一根短绳子拉着墨迹（小圆点） ---------- */
  .ink-dot, .rope {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    will-change: transform;
  }
  .ink-dot.show, .rope.show { opacity: 1; }
  .ink-dot {
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3);
  }
  .rope {
    width: 1px; /* 实际长度用 scaleX 拉出来 */
    height: 2px;
    margin-top: -1px;
    transform-origin: 0 50%;
    background: rgba(255, 255, 255, 0.85);
  }

  /* ---------- 调试面板（按 D 开关） ---------- */
  .debug {
    position: fixed;
    left: 16px;
    top: 16px;
    z-index: 5;
    min-width: 240px;
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.65;
    color: rgba(255, 255, 255, 0.92);
    background: rgba(10, 12, 15, 0.62);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .debug-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 6px; font-weight: 600; }
  .debug-head span { font-weight: 400; color: rgba(255, 255, 255, 0.5); }
  .debug dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 16px; margin: 0; }
  .debug dt { color: rgba(255, 255, 255, 0.6); }
  .debug dd { margin: 0; text-align: right; }
  .debug .yes { color: #7ee2a8; font-weight: 600; }
  .debug-dots { position: fixed; inset: 0; z-index: 2; width: 100%; height: 100%; pointer-events: none; }

  /* ---------- 校准引导：屏幕上方的小卡片（圆圈画在透明画布上） ---------- */
  .guide {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    width: min(440px, calc(100% - 32px));
    padding: 14px 18px;
    border-radius: 18px;
    text-align: center;
    color: #fff;
    background: rgba(10, 12, 15, 0.62);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
  }
  .guide.hidden { display: none; }
  .guide-title { margin-bottom: 4px; font-size: 16px; font-weight: 600; }
  .guide-text { font-size: 14px; line-height: 1.6; color: rgba(255, 255, 255, 0.85); }
  .guide-actions { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
  .btn.small { padding: 8px 20px; font-size: 14px; letter-spacing: 0.04em; }
  .debug.hidden, .debug-dots.hidden { display: none; }
</style>
</head>
<body>

<canvas id="view"></canvas>
<canvas id="water" class="water"></canvas>
<div id="recBadge" class="rec-badge hidden"></div>
<div id="flash" class="flash"></div>
<video id="cam" autoplay muted playsinline></video>
<canvas id="debugDots" class="debug-dots hidden"></canvas>

<div id="brushPreview" class="brush-preview"></div>

<div id="palmZone" class="palm-zone"></div>

<div class="bottom">
  <div id="hint" class="hint hidden"></div>
  <div id="menu" class="menu hidden">
    <div class="menu-panel">
      <label class="slider">
        <span>雾的浓度</span>
        <input id="density" type="range" min="0" max="100" step="1" value="60">
        <output id="densityValue">60%</output>
      </label>
      <label class="slider">
        <span>消散速度</span>
        <input id="fade" type="range" min="0" max="100" step="1" value="31">
        <output id="fadeValue">4 分钟</output>
      </label>
      <label class="slider">
        <span>擦痕粗细</span>
        <input id="brush" type="range" min="0" max="100" step="1" value="53">
        <output id="brushValue">53%</output>
      </label>
      <label class="slider">
        <span>手掌擦雾</span>
        <input id="palmSpeed" type="range" min="0" max="100" step="1" value="40">
        <output id="palmSpeedValue">4 秒</output>
      </label>
      <label class="slider">
        <span>哈气灵敏度</span>
        <input id="breathSens" type="range" min="0" max="100" step="1" value="57">
        <output id="breathSensValue">57%</output>
      </label>
      <label class="slider">
        <span>要靠多近</span>
        <input id="breathNear" type="range" min="0" max="100" step="1" value="48">
        <output id="breathNearValue">48%</output>
      </label>
      <div class="mode-row">
        <span>擦雾手势</span>
        <div id="drawModes" class="seg">
          <button type="button" data-mode="pinch">捏住</button>
          <button type="button" data-mode="point">竖起食指</button>
        </div>
      </div>
      <label class="switch-row">
        <span>辅助书写<small>线条更平滑：墨迹跟在指尖后面一小段</small></span>
        <input id="assist" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
      </label>
      <label class="switch-row">
        <span>水珠和水痕</span>
        <input id="drops" type="checkbox" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>
      <label class="switch-row">
        <span>手掌擦雾时显示圆圈</span>
        <input id="zoneRing" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
      </label>
      <div class="menu-actions">
        <button id="invertBtn" class="menu-action" type="button" title="快捷键：I">反转</button>
        <button id="clearBtn" class="menu-action" type="button" title="快捷键：X">清除所有雾</button>
        <button id="calibBtn" class="menu-action" type="button">校准手势</button>
      </div>
      <div class="menu-note">快捷键：S 截屏 · R 录屏（再按停）· I 反转 · X 清雾 · D 调试</div>
    </div>
    <button id="menuBtn" class="menu-btn" type="button" aria-label="设置" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M4 8h8M16 8h4M4 16h4M12 16h8"></path>
        <circle cx="14" cy="8" r="2"></circle>
        <circle cx="10" cy="16" r="2"></circle>
      </svg>
    </button>
  </div>
</div>

<div id="debug" class="debug hidden">
  <div class="debug-head">调试信息<span>按 D 关闭</span></div>
  <dl id="debugRows"></dl>
</div>

<div id="guide" class="guide hidden">
  <div id="guideTitle" class="guide-title"></div>
  <div id="guideText" class="guide-text"></div>
  <div class="guide-actions">
    <button id="guideOther" class="btn small" hidden></button>
    <button id="guideSkip" class="btn ghost small">跳过</button>
  </div>
</div>

<section id="start" class="screen">
  <div class="card">
    <h1>雾镜</h1>
    <p class="lead">对着镜头哈气起雾，捏住拇指和食指擦雾</p>
    <button id="startBtn" class="btn">开始</button>
    <p class="note">哈气时把脸靠近镜头，张嘴「哈——」<br>捏合认不准时，点底部小圆圈里的「校准手势」<br>画面只在你的电脑里处理，不会上传</p>
  </div>
</section>

<section id="problem" class="screen hidden">
  <div class="card problem">
    <h2 id="problemTitle"></h2>
    <div id="problemBody"></div>
    <div class="actions">
      <button id="retryBtn" class="btn">再试一次</button>
      <button id="reloadBtn" class="btn ghost">刷新页面</button>
    </div>
  </div>
</section>

<script type="module">
// =====================================================================
//  雾镜 · 做到第二阶段：镜子 + 雾 + 鼠标/捏合手势擦雾 + 空格起雾
//
//  画面是怎么来的：
//    摄像头 → <video>（藏起来）→ 每一帧用 WebGL（让显卡画图）画到 <canvas> 上。
//    显卡手里有两份画面：「清晰镜像」和「起雾的镜像」（模糊、发白，像水蒸气），
//    再照着「雾浓度表」决定每个位置显示哪一份、各占多少。
//
//  雾是怎么存的（最重要的一点）：
//    fog.density 是一张看不见的表格，每一格管屏幕上 3×3 个像素，
//    存一个 0（没雾）到 1（最浓）的数。
//    起雾 = 往表里加；擦雾 = 从表里减；消散 = 每帧整体减一点点。
//    雾只存在这张表里，画面每帧照着它重新合成，所以擦掉的地方不会被盖回去。
// =====================================================================

// ---------- 可以调的数字（第四阶段会做进设置面板） ----------
const SETTINGS = {
  brushSize: 0.035,   // 擦痕半径 = 屏幕短边 × 这个比例
  fadeSeconds: 240,   // 最浓的雾放着不管，大约多少秒散完（小气泡里的「消散速度」滑条调的就是它）
  refogSeconds: 3,    // 浓度 60% 时，按空格后雾大约多少秒长到最浓；浓度越低起得越快（见 refogTime）
  pinchOn: 0.3,       // 「两指间隙 ÷ 手掌长度」小于它算捏住，捏住后大于它 + 0.06 才算松开（按 D 看数值）。没校准过的手就用它（见 pinchOnFor）
  pinchMargin: 0.1,   // 校准过的手：画面中间的门槛 = 校准时捏住的数值 + 它（最多到 pinchOn）。越小，手指张开一点就越早停笔
  breathOpen: 0.25,   // 嘴张多大算「张嘴」（0~1，MediaPipe 的 jawOpen 和 mouthFunnel 取大的那个，按 D 看数值）。第四阶段做成「哈气灵敏度」
  breathClose: 0.28,  // 脸多大才算「靠近镜头」：脸的宽度 ÷ 画面宽度。第四阶段做成「需要靠多近」
  breathHold: 500,    // 张着嘴、靠近镜头，要保持多久才开始起雾（毫秒）：说话、笑一下不会起雾
  palmSeconds: 4,     // 手掌张开在雾上，手掌下面一处雾要多少秒擦干净（小气泡里的「手掌擦雾」滑条）
  fogDensity: 0.6,    // 雾的浓度 0~1：屏幕底部的滑条调的就是它（浏览器会记住）
};

const CELL = 3;       // 雾浓度表的一格 = 屏幕上 3×3 个像素（格子越小，擦痕边缘越细腻）
const MAX_DPR = 1.5;  // 画布最多按 1.5 倍清晰度画：摄像头本身没那么清楚，画得更细只会更费电

// 手势识别用的 MediaPipe：版本号写死，免得它以后自己升级出问题
const MP_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.0';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

const $ = (id) => document.getElementById(id);
const canvas = $('view');
const video = $('cam');
const startScreen = $('start');
const startBtn = $('startBtn');
const problemScreen = $('problem');
const hint = $('hint');

let W = 0, H = 0;     // 窗口大小（CSS 像素）
let running = false;  // 摄像头开好了没有

// =====================================================================
//  1. 开始按钮 → 打开摄像头
// =====================================================================
startBtn.addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('reloadBtn').addEventListener('click', () => location.reload());

async function start() {
  hide(problemScreen);
  show(startScreen);
  startBtn.disabled = true;
  startBtn.textContent = '正在打开摄像头…';
  startBtn.blur();

  if (!initGL()) return showProblem('webgl');
  // 只有「安全地址」（https:// 或 localhost）才有 mediaDevices
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return showProblem('insecure');

  try {
    if (video.srcObject) video.srcObject.getTracks().forEach((t) => t.stop()); // 上次没开成功的先关掉
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
    });
    await video.play();
    await videoHasSize();
  } catch (err) {
    console.error(err);
    return showProblem(err && err.name);
  }

  // 摄像头中途断开（被拔掉、被别的程序抢走）
  const track = video.srcObject.getVideoTracks()[0];
  if (track) track.addEventListener('ended', () => { running = false; showProblem('ended'); });

  hide(startScreen);
  running = true;
  watchVideoFrames();
  requestAnimationFrame(loop);
  flashHint();
  show(menuEl);
}

// 底部提示：跟着手势识别的状态变
function hintText() {
  const parts = [];
  if (faceStatus === 'ready') parts.push('脸靠近镜头，张嘴「哈——」起雾');
  else if (faceStatus === 'failed') parts.push('哈气识别没加载成功（检查一下网络），先按空格起雾');
  else parts.push('哈气识别加载中…（先按空格起雾）');
  if (handStatus === 'ready') {
    parts.push(drawMode === 'point' ? '竖起食指擦雾（伸出中指就停）' : '捏住拇指和食指擦雾', '手掌张开在雾上慢慢抹：手掌下面的雾慢慢变淡 · X 清掉所有雾');
  }
  else if (handStatus === 'failed') parts.push('手势识别没加载成功（检查一下网络），先用鼠标擦');
  else parts.push('手势识别加载中…先用鼠标擦');
  parts.push('D 调试');
  return parts.join(' · ');
}

let hintTimer = 0;
function flashHint(message) { // 显示（或更新）提示，8 秒后变淡。给了 message 就临时显示它，4 秒后换回平常的提示
  hint.textContent = message || hintText();
  show(hint);
  hint.classList.remove('dim');
  clearTimeout(hintTimer);
  hintTimer = message
    ? setTimeout(() => flashHint(), 4000)
    : setTimeout(() => hint.classList.add('dim'), 8000);
}

// ---------- 小气泡里的两个滑条：雾的浓度、擦痕粗细 ----------
// 调好的值存在这个浏览器里，下次打开还是它
const brushPreview = $('brushPreview');
const SLIDERS = [
  {
    input: $('density'), output: $('densityValue'), key: 'fogMirror.density',
    get: () => SETTINGS.fogDensity,
    set: (v) => { SETTINGS.fogDensity = v; },
    toValue: (pct) => pct / 100, // 滑条 0~100 → 浓度 0~1
    toPct: (v) => v * 100,
  },
  {
    input: $('brush'), output: $('brushValue'), key: 'fogMirror.brush',
    get: () => SETTINGS.brushSize,
    set: (v) => { SETTINGS.brushSize = v; },
    toValue: (pct) => 0.012 * Math.pow(7.5, pct / 100), // 滑条 0~100 → 擦痕半径占屏幕短边 0.012~0.09，越往右越粗
    toPct: (v) => (Math.log(v / 0.012) / Math.log(7.5)) * 100,
    onChange: showBrushPreview,
  },
  {
    input: $('fade'), output: $('fadeValue'), key: 'fogMirror.fade',
    get: () => SETTINGS.fadeSeconds,
    set: (v) => { SETTINGS.fadeSeconds = v; },
    toValue: (pct) => 600 * Math.pow(30 / 600, pct / 100), // 越往右散得越快：最浓的雾放着不管，10 分钟 ~ 30 秒散完
    toPct: (v) => (Math.log(v / 600) / Math.log(30 / 600)) * 100,
    format: (v) => (v >= 90 ? `${Math.round(v / 60)} 分钟` : `${Math.round(v)} 秒`), // 显示「多久散完」，比百分比好懂
  },
  {
    input: $('palmSpeed'), output: $('palmSpeedValue'), key: 'fogMirror.palmSeconds',
    get: () => SETTINGS.palmSeconds,
    set: (v) => { SETTINGS.palmSeconds = v; },
    toValue: (pct) => 10 * Math.pow(0.1, pct / 100), // 越往右擦得越快：一处雾 10 秒 ~ 1 秒擦干净
    toPct: (v) => (Math.log(v / 10) / Math.log(0.1)) * 100,
    format: (v) => `${v >= 3 ? Math.round(v) : v.toFixed(1)} 秒`, // 显示「一处多少秒擦干净」
  },
  {
    input: $('breathSens'), output: $('breathSensValue'), key: 'fogMirror.breathOpen',
    get: () => SETTINGS.breathOpen,
    set: (v) => { SETTINGS.breathOpen = v; },
    toValue: (pct) => 0.45 - (0.35 * pct) / 100, // 越往右越灵敏：嘴张开 0.45 ~ 0.10 就算张嘴
    toPct: (v) => ((0.45 - v) / 0.35) * 100,
  },
  {
    input: $('breathNear'), output: $('breathNearValue'), key: 'fogMirror.breathClose',
    get: () => SETTINGS.breathClose,
    set: (v) => { SETTINGS.breathClose = v; },
    toValue: (pct) => 0.12 + (0.33 * pct) / 100, // 越往右要靠得越近：脸的宽度要占画面的 12% ~ 45%
    toPct: (v) => ((v - 0.12) / 0.33) * 100,
  },
];

for (const s of SLIDERS) {
  try {
    const pct = s.toPct(parseFloat(localStorage.getItem(s.key)));
    if (Number.isFinite(pct)) s.set(s.toValue(clamp(pct, 0, 100))); // 存的值先限制在滑条的范围里
  } catch (err) { /* 有的浏览器不让存，就用默认值 */ }
  showSlider(s);
  s.input.addEventListener('input', () => {
    s.set(s.toValue(Number(s.input.value)));
    showSlider(s);
    if (s.onChange) s.onChange();
    try { localStorage.setItem(s.key, String(s.get())); } catch (err) { /* 存不了也没关系 */ }
  });
}

function showSlider(s) {
  const pct = Math.round(clamp(s.toPct(s.get()), 0, 100));
  s.input.value = pct;
  s.output.textContent = s.format ? s.format(s.get()) : `${pct}%`;
  s.input.style.setProperty('--fill', `${pct}%`); // 滑条左边填成白色的那一段
}

// 调粗细时，屏幕中间出现一个和擦痕一样粗的圆，松手一会儿就消失
let previewTimer = 0;
function showBrushPreview() {
  const d = 2 * brushRadius();
  brushPreview.style.width = `${d}px`;
  brushPreview.style.height = `${d}px`;
  brushPreview.classList.add('show');
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => brushPreview.classList.remove('show'), 900);
}

// ---------- 底部中间的小圆圈：点一下弹出小气泡，再点一下（或者点外面、按 Esc）收起 ----------
const menuEl = $('menu');
const menuBtn = $('menuBtn');
let menuOpen = false;
function setMenu(open) {
  menuOpen = open;
  menuEl.classList.toggle('open', open);
  menuEl.parentElement.classList.toggle('menu-open', open); // 气泡会盖到提示的位置：打开时把提示藏起来
  menuBtn.setAttribute('aria-expanded', String(open));
  if (!open && menuEl.contains(document.activeElement)) document.activeElement.blur(); // 收起后按方向键不会再去动滑条
}
menuBtn.addEventListener('click', (e) => {
  e.currentTarget.blur(); // 免得之后按空格又「点」了它一下
  setMenu(!menuOpen);
});
// 点气泡外面的地方：收起来。这一下只用来收气泡，不会擦到雾
window.addEventListener('pointerdown', (e) => {
  if (!menuOpen || menuEl.contains(e.target)) return;
  setMenu(false);
  e.stopPropagation();
}, true);
$('clearBtn').addEventListener('click', (e) => {
  e.currentTarget.blur();
  if (running) clearAllFog();
});
$('invertBtn').addEventListener('click', (e) => {
  e.currentTarget.blur();
  if (running) toggleInvert();
});

// ---------- 小气泡里的「水珠和水痕」开关（默认开着，存在这个浏览器里） ----------
const dropsBox = $('drops');
let dropsOn = true;
try { dropsOn = localStorage.getItem('fogMirror.drops') !== '0'; } catch (err) { /* 读不了就用默认：开 */ }
dropsBox.checked = dropsOn;
dropsBox.addEventListener('change', () => {
  dropsOn = dropsBox.checked;
  dropsBox.blur(); // 免得之后按空格又把它切换一下
  if (!dropsOn) clearWater(); // 关掉的时候，已经有的水珠也一起擦掉
  try { localStorage.setItem('fogMirror.drops', dropsOn ? '1' : '0'); } catch (err) { /* 存不了也没关系 */ }
  flashHint(dropsOn ? '水珠和水痕开了：擦痕边上会有小水珠，有的会往下流' : '水珠和水痕关了');
});

// ---------- 小气泡里的「手掌擦雾时显示圆圈」开关（默认关：用户说「不要有那个圆圈，或者说可选」） ----------
const zoneRingBox = $('zoneRing');
let zoneRingOn = false;
try { zoneRingOn = localStorage.getItem('fogMirror.zoneRing') === '1'; } catch (err) { /* 读不了就用默认：关 */ }
zoneRingBox.checked = zoneRingOn;
zoneRingBox.addEventListener('change', () => {
  zoneRingOn = zoneRingBox.checked;
  zoneRingBox.blur(); // 免得之后按空格又把它切换一下
  try { localStorage.setItem('fogMirror.zoneRing', zoneRingOn ? '1' : '0'); } catch (err) { /* 存不了也没关系 */ }
  flashHint(zoneRingOn ? '手掌擦雾时会显示一个圆圈，圈住正在擦淡的范围' : '手掌擦雾时不显示圆圈了');
});

// ---------- 小气泡里的「辅助书写」开关（存在这个浏览器里） ----------
// 打开后，捏住写字时墨迹被一根短「绳子」拉着走（见 followInk），线条更平滑
const assistBox = $('assist');
let assistOn = false;
try { assistOn = localStorage.getItem('fogMirror.assist') === '1'; } catch (err) { /* 读不了就用默认：关 */ }
assistBox.checked = assistOn;
assistBox.addEventListener('change', () => {
  assistOn = assistBox.checked;
  assistBox.blur(); // 免得之后按空格又把它切换一下
  try { localStorage.setItem('fogMirror.assist', assistOn ? '1' : '0'); } catch (err) { /* 存不了也没关系 */ }
  flashHint(assistOn ? '辅助书写开了：墨迹跟在指尖后面一小段，写出来的线更平滑' : '辅助书写关了：墨迹贴在指尖上');
});

// ---------- 小气泡里的「擦雾手势」：捏住（默认），或者竖起食指（见 pointPose）。存在这个浏览器里 ----------
let drawMode = 'pinch';
try { if (localStorage.getItem('fogMirror.drawMode') === 'point') drawMode = 'point'; } catch (err) { /* 用默认：捏住 */ }
const modeButtons = document.querySelectorAll('#drawModes button');
function showDrawMode() { modeButtons.forEach((b) => b.classList.toggle('on', b.dataset.mode === drawMode)); }
showDrawMode();
modeButtons.forEach((b) => b.addEventListener('click', () => {
  b.blur();
  if (b.dataset.mode === drawMode) return;
  drawMode = b.dataset.mode;
  for (const p of pens) { // 正在擦的先停下，换了手势重新开始
    if (p.pinched) strokeEnd(p);
    p.pinched = false;
    p.pausedAt = 0;
    p.votes = 0;
  }
  try { localStorage.setItem('fogMirror.drawMode', drawMode); } catch (err) { /* 存不了也没关系 */ }
  showDrawMode();
  flashHint(drawMode === 'point'
    ? '换成竖起食指擦雾：竖起食指（其它手指弯着）就擦，伸出中指就停'
    : '换成捏住擦雾：捏住拇指和食指就擦，松开就停');
}));

// 等摄像头画面真正有了尺寸（有的浏览器 play() 之后还要再等一下）
function videoHasSize() {
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    (function check() {
      if (video.videoWidth > 0) resolve();
      else if (performance.now() - t0 > 5000) reject(Object.assign(new Error('摄像头没有画面'), { name: 'NoVideo' }));
      else requestAnimationFrame(check);
    })();
  });
}

// ---------- 出错时用中文说明怎么办 ----------
const isSafari = /^((?!chrome|chromium|crios|fxios|edg|android).)*safari/i.test(navigator.userAgent);

const PROBLEMS = {
  denied: {
    title: '摄像头权限被拒绝了',
    body: () => '<p>雾镜要用摄像头当镜子。画面只在你的电脑里处理，不会上传。按下面的步骤打开权限：</p>' + permissionSteps(),
    retry: false,
  },
  notfound: {
    title: '没有找到摄像头',
    body: () => '<p>电脑好像没有能用的摄像头。如果用的是外接摄像头，检查一下有没有插好，然后点「再试一次」。</p>',
    retry: true,
  },
  busy: {
    title: '摄像头被别的程序占用了',
    body: () => '<p>可能是 FaceTime、Photo Booth、Zoom、腾讯会议之类的程序正在用摄像头。把它们关掉，再点「再试一次」。</p>',
    retry: true,
  },
  ended: {
    title: '摄像头断开了',
    body: () => '<p>摄像头好像被拔掉了，或者被别的程序拿走了。点「再试一次」重新打开。</p>',
    retry: true,
  },
  insecure: {
    title: '这样打开用不了摄像头',
    body: () => '<p>浏览器只允许「安全地址」使用摄像头：网址要以 <b>https://</b> 开头，或者是 <b>http://localhost</b>。</p>'
      + '<p>如果你是双击 index.html 打开的，请改成在浏览器里打开本地服务器的地址，比如 <b>http://localhost:8000</b>。</p>',
    retry: false,
  },
  webgl: {
    title: '浏览器画不了这个画面',
    body: () => '<p>雾镜要用显卡画图（WebGL），但这个浏览器没有开启。请换最新版的 Chrome 或 Safari 试试。</p>',
    retry: false,
  },
  lost: {
    title: '画面中断了',
    body: () => '<p>显卡画图被系统打断了（比如电脑刚从睡眠中醒来）。刷新一下页面就好。</p>',
    retry: false,
  },
  other: {
    title: '打开摄像头时出了点问题',
    body: (name) => `<p>可以点「再试一次」，或者刷新页面。</p><p class="small">错误代码：${escapeHtml(name || '未知')}</p>`,
    retry: true,
  },
};

function permissionSteps() {
  const site = escapeHtml(location.hostname || '这个网站');
  const browserSteps = isSafari
    ? `<p class="step-title">在 Safari 里允许：</p>
       <ol>
         <li>点屏幕左上角菜单栏的「Safari 浏览器」→「设置…」</li>
         <li>点上面一排的「网站」，再点左边的「摄像头」</li>
         <li>在右边找到 <b>${site}</b>，改成「允许」</li>
       </ol>`
    : `<p class="step-title">在 Chrome 里允许：</p>
       <ol>
         <li>点地址栏最左边、网址前面的小图标</li>
         <li>找到「摄像头」，把它打开（或改成「允许」）</li>
       </ol>`;
  return browserSteps + `
    <p class="step-title">如果浏览器里已经是「允许」，可能是 Mac 系统挡住了：</p>
    <ol>
      <li>点屏幕左上角的苹果图标 →「系统设置」</li>
      <li>点「隐私与安全性」→「摄像头」</li>
      <li>在列表里找到你用的浏览器，打开它旁边的开关（系统可能会让你重新打开浏览器）</li>
    </ol>
    <p>都改好以后，点下面的「刷新页面」。</p>`;
}

function showProblem(name) {
  const kind =
    ['NotAllowedError', 'PermissionDeniedError', 'SecurityError'].includes(name) ? 'denied' :
    ['NotFoundError', 'DevicesNotFoundError', 'OverconstrainedError'].includes(name) ? 'notfound' :
    ['NotReadableError', 'TrackStartError', 'AbortError'].includes(name) ? 'busy' :
    name in PROBLEMS ? name : 'other';
  const p = PROBLEMS[kind];
  $('problemTitle').textContent = p.title;
  $('problemBody').innerHTML = p.body(name);
  $('retryBtn').hidden = !p.retry;
  $('reloadBtn').classList.toggle('ghost', p.retry); // 只剩「刷新页面」一个按钮时，让它显眼一点
  startBtn.disabled = false;
  startBtn.textContent = '开始';
  hide(hint);
  setMenu(false);
  hide(menuEl);
  if (recorder) recorder.stop(); // 摄像头断了：正在录的先停下存好
  show(problemScreen); // 盖在开始页上面；点「再试一次」时拿掉它，下面就是开始页
}

// =====================================================================
//  2. 雾浓度表：雾只存在这里
// =====================================================================
const fog = {
  w: 0, h: 0,                       // 表格有多少列、多少行
  density: new Float32Array(0),     // 每格的雾浓度：0 = 没雾，1 = 最浓
  bytes: new Uint8ClampedArray(0),  // 同一张表的 0~255 版本，交给显卡用
  lumpy: new Float32Array(0),       // 每格一个 0~1 的随机数（大块起伏）：哪里雾长得快、散得快
  ink: new Float32Array(0),         // 每格「写过」多少（用手或鼠标擦过的地方，0~1）：反转时用（见 toggleInvert）
};

function resizeFog() {
  const w = Math.ceil(W / CELL), h = Math.ceil(H / CELL);
  if (w === fog.w && h === fog.h) return;
  const old = fog.density, oldInk = fog.ink, ow = fog.w, oh = fog.h;
  const density = new Float32Array(w * h), ink = new Float32Array(w * h);
  if (ow === 0) {
    density.fill(1); // 刚打开：满屏是雾
  } else {           // 窗口大小变了：尽量保留原来的雾和写过的字
    for (let j = 0; j < h; j++) {
      for (let i = 0; i < w; i++) {
        const from = Math.min(j, oh - 1) * ow + Math.min(i, ow - 1);
        density[j * w + i] = old[from];
        ink[j * w + i] = oldInk[from];
      }
    }
  }
  inverted = null; // 反转记下的字是按旧的格子存的，大小变了就不能用了
  fogAnim = null;
  const lumpy = new Float32Array(w * h);
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      const x = (i + 0.5) * CELL, y = (j + 0.5) * CELL; // 这一格在屏幕上的位置
      lumpy[j * w + i] = 0.65 * smoothNoise(x / 190, y / 190) + 0.35 * smoothNoise(x / 70 + 31, y / 70 + 17);
    }
  }
  Object.assign(fog, { w, h, density, ink, lumpy, bytes: new Uint8ClampedArray(w * h) });
  for (let k = 0; k < density.length; k++) fog.bytes[k] = density[k] * 255;
  gl.bindTexture(gl.TEXTURE_2D, maskTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, w, h, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, fog.bytes);
}

let refogLeft = 0; // 按空格后，还要继续起雾多少秒
let clearLeft = 0; // 「清除所有雾」之后，还要继续散多少秒
const CLEAR_SECONDS = 0.6; // 清除所有雾：整面雾在这么多秒里很快淡掉（一下子没了看起来太突然）

// 清除所有雾：小气泡里的按钮，或者 X 键（只擦淡一片用手掌，见 thinPalms）
function clearAllFog() {
  refogLeft = 0; // 正在起雾的话也停下来
  clearLeft = CLEAR_SECONDS;
  breath.level = 0; // 下一口气从嘴边一小片重新开始长
  clearWater();
  fog.ink.fill(0); // 写过的字也不算了
  inverted = null;
  fogAnim = null;
  flashHint('雾都清掉了 · 脸靠近镜头哈气，就能重新起雾');
}

// ---------- 反转（用户要的）：写过的字变成「雾做的字」，别的地方的雾都去掉，方便字和人一起合照；再按一次换回来 ----------
// 写过的地方记在 fog.ink 里（用手或鼠标擦过的地方）。只把「写过、而且现在还是清楚的」地方变成雾：
// 本来就没雾的地方、被雾重新盖住的旧字，都不会变成字。字的边缘和擦痕一样柔和
const INVERT_SECONDS = 0.6; // 慢慢变过去，不会一下子跳
let inverted = null;   // 反转着的时候：那些「雾做的字」（每格的浓度），再按一次就换回「雾里擦出来的字」
let fogAnim = null;    // 雾正在慢慢变成另一个样子（反转、来回抹变淡）：{ from, to, t, seconds }
function toggleInvert() {
  if (!fog.w) return;
  const { density, ink } = fog;
  const to = new Float32Array(density.length);
  if (!inverted) {
    let written = 0;
    for (let k = 0; k < to.length; k++) {
      to[k] = ink[k] * (1 - density[k]);
      if (to[k] > 0.5) written++;
    }
    if (written < 20) {
      flashHint('还没有写字：先在雾上写几个字，再按反转');
      return;
    }
    inverted = to.slice();
    ink.fill(0);
    flashHint('反转了：字变成了雾，别的地方都擦干净了 · 按 S 截屏合照 · 再按一次反转换回来');
  } else {
    for (let k = 0; k < to.length; k++) {
      to[k] = 1 - inverted[k];
      ink[k] = inverted[k]; // 换回来以后还能再反转
    }
    inverted = null;
    flashHint('换回来了：满屏的雾里是擦出来的字');
  }
  clearWater(); // 水珠是贴着原来的擦痕长的，反转以后就不对了
  refogLeft = 0;
  clearLeft = 0;
  fogAnim = { from: density.slice(), to, t: 0, seconds: INVERT_SECONDS };
}

// ---------- 手掌张开在雾上抹（或者捂着不动）：手掌下面那一片雾慢慢变淡，像用手把镜子上的雾慢慢擦掉 ----------
// 用户要的是「范围内」「跟哈气一样慢慢的」，不要整面一起淡（试过「来回抹一下整面淡一层」，用户说不对）。
// 范围和手一样大（见 handZone），手掌张开 0.3 秒后才开始（见 updatePalm），快慢是小气泡里的「手掌擦雾」滑条。
//
// 「看起来有多少雾」（0~1）：着色器里雾盖住画面的程度是 smoothstep(0, 0.6, m)（m = 浓度 × k），
// m 超过 0.6 以后看起来已经盖满了，只是白纱更厚、更糊。直接减浓度的话，前一半时间几乎看不出在变。
// 所以把前 85% 算成「盖住多少」，后 15% 算成「白纱多厚」，按这个匀速往下减，从一开始就看得出在变淡
// （试过 75% / 25%：头一秒只是白纱变薄，看着像没反应）
function fogLook(m) {
  return m <= 0.6 ? 0.85 * smoothstep(0, 0.6, m) : 0.85 + 0.15 * Math.min(1, (m - 0.6) / 0.4);
}

function fogFromLook(v) { // fogLook 倒过来：看起来是 v，浓度（乘过 k 的）应该是多少
  if (v <= 0) return 0;
  if (v <= 0.85) return 0.6 * (0.5 - Math.sin(Math.asin(1 - 2 * (v / 0.85)) / 3)); // smoothstep 倒过来算
  return 0.6 + 0.4 * Math.min(1, (v - 0.85) / 0.15);
}

// 每一帧：正在擦雾的手掌下面，雾按「看起来的雾」每秒少 1/palmSeconds（手掌中间最快，边上慢慢过渡到不变），
// 那一片里的水珠也慢慢被抹掉
function thinPalms(dt) {
  const k = Math.min(1, 0.3 + 1.2 * SETTINGS.fogDensity); // 和着色器里一样
  const rate = dt / SETTINGS.palmSeconds;
  const { w, h, density } = fog;
  for (const pen of pens) {
    if (!pen.palmOn) continue;
    const { x, y, r } = pen.palmZone;
    const i0 = Math.max(0, Math.floor((x - r) / CELL)), i1 = Math.min(w - 1, Math.floor((x + r) / CELL));
    const j0 = Math.max(0, Math.floor((y - r) / CELL)), j1 = Math.min(h - 1, Math.floor((y + r) / CELL));
    for (let j = j0; j <= j1; j++) {
      for (let i = i0; i <= i1; i++) {
        const dx = (i + 0.5) * CELL - x, dy = (j + 0.5) * CELL - y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist >= r) continue;
        const kk = j * w + i, d = density[kk];
        if (d <= 0) continue;
        const v = fogLook(d * k) - rate * (1 - smoothstep(0.55 * r, r, dist));
        density[kk] = Math.min(d, fogFromLook(v) / k);
      }
    }
    for (const list of [water.drops, water.drips]) {
      for (let n = list.length - 1; n >= 0; n--) {
        const p = list[n];
        if (Math.hypot(p.x - x, p.y - y) < r * 0.8 && Math.random() < rate * 2) {
          list.splice(n, 1);
          water.dirty = true;
        }
      }
    }
  }
}

// 起雾要多久：浓度越低，雾越薄，起得越快（浓度 60% 时正好是 refogSeconds，0% 时是它的 0.4 倍，大约 1.2 秒）
function refogTime() {
  return SETTINGS.refogSeconds * (0.4 + SETTINGS.fogDensity);
}

// 每一帧：雾慢慢散；正在哈气的话，从嘴边往外长；刚按过空格的话，整面一起长
function updateFog(dt) {
  if (fogAnim) { // 反转、来回抹变淡：雾慢慢变成目标的样子；这一小会儿里不起雾、也不散雾
    fogAnim.t += dt;
    const p = smoothstep(0, fogAnim.seconds, fogAnim.t);
    const { from, to } = fogAnim;
    for (let k = 0; k < from.length; k++) {
      const v = from[k] + (to[k] - from[k]) * p;
      fog.density[k] = v;
      fog.bytes[k] = v * 255;
    }
    if (fogAnim.t >= fogAnim.seconds) fogAnim = null;
    return;
  }
  const fade = dt / SETTINGS.fadeSeconds;
  const grow = refogLeft > 0 ? dt / refogTime() : 0;
  refogLeft = Math.max(0, refogLeft - dt);
  const clear = clearLeft > 0 ? dt / CLEAR_SECONDS : 0; // 清除所有雾：每处一起往下减，CLEAR_SECONDS 秒减完
  clearLeft = Math.max(0, clearLeft - dt);

  // 哈气：嘴边长得最快，往外越来越慢；哈得越久，长到越远（breath.level），最远盖满整面镜子
  const spread = breathSpreadTime();
  breath.level = breath.on
    ? Math.min(1, breath.level + dt / spread)
    : Math.max(0, breath.level - dt / (spread * 3)); // 停下后慢慢缩回去：接着哈下一口，雾从差不多的大小接着往外扩
  const puff = Boolean(breath.on && breath.at);
  const reach = breathReach() / CELL;                // 现在最远长到哪（单位：格）
  const bx = puff ? breath.at.x / CELL : 0, by = puff ? breath.at.y / CELL : 0;
  const puffRate = dt / (refogTime() * 0.4);         // 嘴边：大约 refogTime 的 0.4 倍时间长到最浓（浓度 60% 时 1.2 秒）

  const { w, h, density, bytes, lumpy } = fog;
  for (let j = 0, k = 0; j < h; j++) {
    for (let i = 0; i < w; i++, k++) {
      const speed = 0.6 + 0.8 * lumpy[k]; // 0.6~1.4 倍：各处快慢不一，看起来更自然
      let add = grow;
      if (puff) {
        const dx = i - bx, dy = j - by;
        const d = Math.sqrt(dx * dx + dy * dy) * (1.2 - 0.4 * lumpy[k]); // 长得快的地方也伸得远一点：雾的边缘弯弯曲曲，不是正圆
        if (d < reach) {
          const t = d / reach;
          add += puffRate * (1 - t * t * (3 - 2 * t)); // 嘴边是 1，往外平滑地降到 0
        }
      }
      let v = density[k] + (add - fade) * speed - clear;
      v = v < 0 ? 0 : v > 1 ? 1 : v;
      density[k] = v;
      bytes[k] = v * 255;
    }
  }
}

// =====================================================================
//  3. 擦雾（鼠标和手势都用这里的 wipe）
// =====================================================================
function brushRadius() { return Math.max(14, Math.min(W, H) * SETTINGS.brushSize); }

// 从 (x0,y0) 擦到 (x1,y1)。擦掉的是一整段「胶囊形」（线段 + 两头圆），
// 所以移动得再快，痕迹也是连着的，不会断成一个个点。
// r：擦多宽（默认是笔刷；往下流的水珠冲出的水痕窄一些）。writing：是不是用手或鼠标「写」的（记到 fog.ink 里，反转时用）
function wipe(x0, y0, x1, y1, r = brushRadius(), writing = false) {
  const soft = r * 0.5; // 外面这一半慢慢过渡，边缘柔和顺滑，不是一刀切
  const { w, h, density, ink } = fog;
  const i0 = Math.max(0, Math.floor((Math.min(x0, x1) - r) / CELL));
  const i1 = Math.min(w - 1, Math.floor((Math.max(x0, x1) + r) / CELL));
  const j0 = Math.max(0, Math.floor((Math.min(y0, y1) - r) / CELL));
  const j1 = Math.min(h - 1, Math.floor((Math.max(y0, y1) + r) / CELL));
  const dx = x1 - x0, dy = y1 - y0;
  const len2 = dx * dx + dy * dy;
  for (let j = j0; j <= j1; j++) {
    const py = (j + 0.5) * CELL;
    for (let i = i0; i <= i1; i++) {
      const px = (i + 0.5) * CELL;
      // 这一格离线段最近的距离
      let t = len2 > 0 ? ((px - x0) * dx + (py - y0) * dy) / len2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const ex = x0 + dx * t - px, ey = y0 + dy * t - py;
      const dist = Math.sqrt(ex * ex + ey * ey);
      if (dist >= r) continue;
      const k = j * w + i;
      // keep：这一格最多还能剩多少雾（中心是 0 = 擦干净，往外顺滑地回到 1）
      const keep = smootherstep(r - soft, r, dist);
      const before = density[k];
      if (keep < before) {
        density[k] = keep; // 只会变少不会变多；同一个地方擦几遍效果一样
        // 写过多少 = 真的擦掉了多少雾，一笔里擦好几下就加起来（本来没雾的地方擦了也不算写过，反转时不会变出字来）
        if (writing) ink[k] = Math.min(1, ink[k] + before - keep);
      }
    }
  }
}

let wiping = false, lastX = 0, lastY = 0, lastUX = 0, lastUY = 1; // lastUX/UY：最后往哪个方向擦（松开时水攒在那头）

canvas.addEventListener('pointerdown', (e) => {
  if (!running || (e.pointerType === 'mouse' && e.button !== 0)) return;
  wiping = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  userWipe(lastX, lastY, lastX, lastY); // 点一下也能擦出一个圆
});
canvas.addEventListener('pointermove', (e) => {
  if (!wiping) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const p of list.length ? list : [e]) { // 两帧之间鼠标可能动了好几下，每一下都擦
    const dx = p.clientX - lastX, dy = p.clientY - lastY, len = Math.hypot(dx, dy);
    if (len > 0.5) {
      lastUX = dx / len;
      lastUY = dy / len;
    }
    userWipe(lastX, lastY, p.clientX, p.clientY);
    lastX = p.clientX;
    lastY = p.clientY;
  }
});
const stopWiping = () => {
  if (wiping) pushWaterEnd(lastX, lastY, lastUX, lastUY);
  wiping = false;
};
canvas.addEventListener('pointerup', stopWiping);
canvas.addEventListener('pointercancel', stopWiping);

// 空格：整面重新起雾（测试用：没有摄像头、认不出脸的时候也能起雾）
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || !running) return;
  e.preventDefault();
  clearLeft = 0; // 刚点过「清除所有雾」也不影响
  refogLeft = refogTime() / 0.6; // 长得最慢的地方（0.6 倍速）也能长满
});

// X：清除所有雾（和小气泡里的按钮一样）。按着 Command / Ctrl 的时候不算（那是剪切）
window.addEventListener('keydown', (e) => {
  if (e.code !== 'KeyX' || e.repeat || !running || e.metaKey || e.ctrlKey || e.altKey) return;
  clearAllFog();
});

// I：反转（和小气泡里的按钮一样）
window.addEventListener('keydown', (e) => {
  if (e.code !== 'KeyI' || e.repeat || !running || e.metaKey || e.ctrlKey || e.altKey) return;
  toggleInvert();
});

// =====================================================================
//  3b. 水珠和水痕：擦雾时，擦掉的雾变成小水珠，被推到擦痕两边；
//      有的水珠攒够了水会往下流，流过的地方雾被冲掉，留下一道清楚的水痕
// =====================================================================
const waterCanvas = $('water');
const waterCtx = waterCanvas.getContext('2d');
const water = { drops: [], drips: [], dirty: true, drawnAt: 0 }; // 静止的水珠、正在往下流的水珠；dirty = 要重画
const MAX_DROPS = 450; // 水珠最多这么多颗，再多就让最早的先干掉
let clock = 0;         // 现在的时间（毫秒，每帧更新），水珠记出生时间用
let dropSprite = null; // 一颗水珠的样子：先画好一张小图，之后每颗按大小贴上去（很快）
let dripSprite = null; // 往下流的水珠的样子（水滴形）

// 画一颗水珠的样子（64×64 的小图，水珠半径 26）：水珠像个小透镜——
// 边上一圈暗（光被折走了）、左上一个高光点、右下透过来一道亮边
function makeDropSprite() {
  const s = document.createElement('canvas');
  s.width = s.height = 64;
  const g = s.getContext('2d');
  const c = 32, R = 26;
  let grad = g.createRadialGradient(c + 2, c + 3, R * 0.55, c + 2, c + 3, R * 1.05); // 偏右下的暗边
  grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  grad.addColorStop(0.75, 'rgba(0, 0, 0, 0.22)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  g.fillStyle = grad;
  g.beginPath();
  g.arc(c + 2, c + 3, R * 1.05, 0, Math.PI * 2);
  g.fill();
  grad = g.createRadialGradient(c - 4, c - 5, 1, c, c, R); // 水珠本身：中间透亮，边上一圈稍亮
  grad.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
  grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.08)');
  grad.addColorStop(1, 'rgba(255, 255, 255, 0.18)');
  g.fillStyle = grad;
  g.beginPath();
  g.arc(c, c, R, 0, Math.PI * 2);
  g.fill();
  g.strokeStyle = 'rgba(255, 255, 255, 0.45)'; // 右下透过来的亮边
  g.lineWidth = 2.2;
  g.lineCap = 'round';
  g.beginPath();
  g.arc(c, c, R * 0.78, Math.PI * 0.15, Math.PI * 0.7);
  g.stroke();
  grad = g.createRadialGradient(c - 9, c - 10, 0, c - 9, c - 10, 7); // 左上的高光点
  grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
  grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
  g.fillStyle = grad;
  g.beginPath();
  g.arc(c - 9, c - 10, 7, 0, Math.PI * 2);
  g.fill();
  return s;
}

function fogAt(x, y) { // 屏幕上某一点的雾有多浓（0~1）
  const i = clamp(Math.floor(x / CELL), 0, fog.w - 1), j = clamp(Math.floor(y / CELL), 0, fog.h - 1);
  return fog.density[j * fog.w + i] || 0;
}

function waterAmount() { return 0.35 + 0.65 * SETTINGS.fogDensity; } // 雾越浓，擦出来的水越多

// 用手或鼠标擦一段：先处理水珠，再擦雾
function userWipe(x0, y0, x1, y1) {
  pushWater(x0, y0, x1, y1);
  wipe(x0, y0, x1, y1, brushRadius(), true);
}

// 擦到的水珠跟着被抹掉；擦掉的雾变成小水珠，被推到擦痕两边（前面的雾越浓、擦得越长，水珠越多）
function pushWater(x0, y0, x1, y1) {
  if (!dropsOn) return; // 小气泡里把「水珠和水痕」关了
  const r = brushRadius();
  takeDrops(x0, y0, x1, y1, r * 0.8);
  const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
  const a = len > 0 ? Math.atan2(dy, dx) : Math.random() * Math.PI * 2;
  const ux = Math.cos(a), uy = Math.sin(a);
  const ahead = fogAt(x1 + ux * r * 0.5, y1 + uy * r * 0.5); // 前面那块（这一笔还没擦到）有多少雾
  if (ahead < 0.2) return;
  // 这一段大约推出几颗（用户说 1.5 倍时「有一点点多」，改成 0.9）
  const expected = (Math.max(len, r * 0.25) / (r * 0.25)) * ahead * waterAmount() * 0.9;
  let n = Math.floor(expected) + (Math.random() < expected % 1 ? 1 : 0);
  while (n-- > 0) {
    const side = Math.random() < 0.5 ? -1 : 1; // 左边还是右边
    const t = Math.random(), off = r * (0.82 + 0.22 * Math.random());
    const x = x0 + dx * t - uy * side * off, y = y0 + dy * t + ux * side * off;
    if (fogAt(x, y) < 0.15) continue; // 边上本来就没雾（之前擦过）：不长水珠
    // 大多是小的，偶尔一颗大的；在擦痕下边的（水往低处攒），才有可能往下流
    addDrop(x, y, clamp(r * (0.045 + 0.13 * Math.random() * Math.random()), 1.2, 6), ux * side > 0.3);
  }
}

// 一笔擦完：往前推的水攒在擦痕的头上，多留几颗、大一点的水珠
function pushWaterEnd(x, y, ux, uy) {
  if (!dropsOn) return;
  const r = brushRadius();
  const amount = fogAt(x + ux * r * 1.2, y + uy * r * 1.2) * waterAmount();
  if (amount < 0.2) return;
  const n = Math.round(1 + 2 * amount);
  const a0 = Math.atan2(uy, ux);
  for (let i = 0; i < n; i++) {
    const a = a0 + (Math.random() - 0.5) * 2.4, off = r * (0.85 + 0.2 * Math.random()); // 前面那半圈
    addDrop(x + Math.cos(a) * off, y + Math.sin(a) * off, clamp(r * (0.06 + 0.12 * Math.random()), 1.3, 7), Math.sin(a) > 0.3);
  }
}

// 加一颗水珠。canDrip：在擦痕下边、又大一点（超过 2.2 像素）的，有三分之一会在 1~5 秒后（攒够了水）往下流
function addDrop(x, y, r, canDrip = false) {
  const drop = { x, y, r, born: clock, life: 40000 + Math.random() * 60000 }; // 40~100 秒后慢慢干掉
  if (canDrip && r > 2.2 && Math.random() < 0.35) drop.dripAt = clock + 1000 + Math.random() * 4000;
  water.drops.push(drop);
  if (water.drops.length > MAX_DROPS) water.drops.shift();
  water.dirty = true;
}

// 拿走一段路上的水珠（被擦到的，或者被往下流的水珠吞掉的），返回拿走了多少水（半径平方加起来）
function takeDrops(x0, y0, x1, y1, r, lists = [water.drops, water.drips]) {
  const dx = x1 - x0, dy = y1 - y0, len2 = dx * dx + dy * dy;
  let taken = 0;
  for (const list of lists) {
    for (let k = list.length - 1; k >= 0; k--) {
      const p = list[k];
      const t = len2 > 0 ? clamp(((p.x - x0) * dx + (p.y - y0) * dy) / len2, 0, 1) : 0;
      if (Math.hypot(x0 + dx * t - p.x, y0 + dy * t - p.y) < r + p.r * 0.5) {
        taken += p.r * p.r;
        list.splice(k, 1);
        water.dirty = true;
      }
    }
  }
  return taken;
}

function clearWater() { // 清除所有雾时，水珠也一起擦掉
  water.drops = [];
  water.drips = [];
  water.dirty = true;
}

// 每一帧：水珠慢慢干掉；到时间的开始往下流。
// 往下流的像真的水珠（用户说以前的「流下来有点不真实」）：刚开始慢、慢慢加速，越大越快；
// 时不时在干一点的地方「挂住」一下、慢下来，再接着流；左右不是来回摆，而是随机地、慢慢地偏一点；
// 流过的地方雾被冲掉（水痕和水珠一样宽，越流越细）；路上碰到的小水珠被吞进来变大；
// 一路上留下水，越流越小、越流越慢，最后停下变回一颗水珠
function updateWater(dt) {
  for (let k = water.drops.length - 1; k >= 0; k--) {
    const d = water.drops[k];
    if (d.dripAt && clock >= d.dripAt) {
      water.drops.splice(k, 1);
      water.drips.push({ x: d.x, y: d.y, r: Math.min(6, d.r * 1.25), vx: 0, vy: 0, stuck: 0 });
      water.dirty = true;
    } else if (clock - d.born > d.life) {
      water.drops.splice(k, 1);
      water.dirty = true;
    }
  }
  for (let k = water.drips.length - 1; k >= 0; k--) {
    const p = water.drips[k];
    if (p.stuck > 0) { // 挂住了：很快慢下来
      p.stuck -= dt;
      p.vy *= 1 - Math.min(1, dt * 10);
    } else {
      const target = 25 + 50 * (p.r - 1.5);           // 越大越快：半径 2 像素每秒 50 像素，4 像素每秒 150 像素
      p.vy += (target - p.vy) * Math.min(1, dt * 2.5); // 慢慢加速，不会一下子冲出去
      if (Math.random() < dt * 0.9) p.stuck = 0.15 + Math.random() * 0.5; // 大约一秒挂住一次
    }
    p.vx += (Math.random() - 0.5) * 80 * dt; // 左右随机偏一点，很快又回正
    p.vx *= 1 - Math.min(1, dt * 3);
    const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
    const step = Math.hypot(nx - p.x, ny - p.y);
    if (step > 0.01) {
      wipe(p.x, p.y, nx, ny, Math.max(3.5, p.r * 0.9)); // 流过的地方，雾被冲掉一道
      const got = takeDrops(p.x, p.y, nx, ny, p.r, [water.drops]);
      if (got) p.r = Math.min(7, Math.sqrt(p.r * p.r + got * 0.5));
      p.r -= step * 0.007;
      if (Math.random() < step * 0.03) { // 水痕边上偶尔留下一颗小水珠
        const side = Math.random() < 0.5 ? -1 : 1;
        addDrop(p.x + side * (p.r * 0.9 + 1.5), p.y - p.r, Math.max(0.8, p.r * (0.3 + 0.2 * Math.random())));
      }
      p.x = nx;
      p.y = ny;
    }
    if (p.r < 1.8 || p.y > H + 10) {
      water.drips.splice(k, 1);
      if (p.y < H) addDrop(p.x, p.y, Math.max(1.2, p.r)); // 停下的地方留一颗水珠（不会再流）
    }
    water.dirty = true;
  }
}

// 往下流的水珠：下面圆、上面拖一点尖（64×96 的小图，圆的半径 22，圆心在 (32, 66)）
function makeDripSprite() {
  const s = document.createElement('canvas');
  s.width = 64;
  s.height = 96;
  const g = s.getContext('2d');
  const shape = () => {
    g.beginPath();
    g.moveTo(32, 16); // 上面的尖
    g.bezierCurveTo(37, 36, 54, 50, 54, 66);
    g.arc(32, 66, 22, 0, Math.PI); // 下面半圆
    g.bezierCurveTo(10, 50, 27, 36, 32, 16);
    g.closePath();
  };
  g.save(); // 偏右下的暗边
  g.translate(1.5, 2);
  shape();
  g.strokeStyle = 'rgba(0, 0, 0, 0.22)';
  g.lineWidth = 3;
  g.stroke();
  g.restore();
  shape(); // 身子：中间透亮，边上一圈稍亮
  const grad = g.createRadialGradient(28, 60, 2, 32, 62, 30);
  grad.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
  grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.1)');
  grad.addColorStop(1, 'rgba(255, 255, 255, 0.22)');
  g.fillStyle = grad;
  g.fill();
  g.strokeStyle = 'rgba(255, 255, 255, 0.45)'; // 右下透过来的亮边
  g.lineWidth = 2.4;
  g.lineCap = 'round';
  g.beginPath();
  g.arc(32, 66, 17, Math.PI * 0.1, Math.PI * 0.65);
  g.stroke();
  const hl = g.createRadialGradient(24, 56, 0, 24, 56, 7); // 左上的高光点
  hl.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
  hl.addColorStop(1, 'rgba(255, 255, 255, 0)');
  g.fillStyle = hl;
  g.beginPath();
  g.arc(24, 56, 7, 0, Math.PI * 2);
  g.fill();
  return s;
}

// 把水珠画到透明画布上。有水珠在流、或者刚有变化才重画；快干掉的水珠慢慢变淡，0.2 秒重画一次就够
function drawWater(now) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(W * dpr), h = Math.round(H * dpr);
  if (waterCanvas.width !== w || waterCanvas.height !== h) {
    waterCanvas.width = w;
    waterCanvas.height = h;
    water.dirty = true;
  }
  const fading = water.drops.some((d) => now - d.born > d.life - 6000);
  if (!water.dirty && !(fading && now - water.drawnAt > 200)) return;
  water.dirty = false;
  water.drawnAt = now;
  if (!dropSprite) {
    dropSprite = makeDropSprite();
    dripSprite = makeDripSprite();
  }
  waterCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  waterCtx.clearRect(0, 0, W, H);
  const k = 32 / 26; // 小图比水珠本身大一圈（留给暗边）
  for (const d of water.drops) {
    waterCtx.globalAlpha = clamp((d.life - (now - d.born)) / 6000, 0, 1); // 干掉之前 6 秒慢慢变淡
    waterCtx.drawImage(dropSprite, d.x - d.r * k, d.y - d.r * k, 2 * d.r * k, 2 * d.r * k);
  }
  waterCtx.globalAlpha = 1;
  for (const p of water.drips) { // 往下流的：下面圆、上面拖一点尖（小图里圆的半径 22，圆心在 (32, 66)）
    const s = p.r / 22;
    waterCtx.drawImage(dripSprite, p.x - 32 * s, p.y - 66 * s, 64 * s, 96 * s);
  }
}

// =====================================================================
//  4. 手势擦雾：MediaPipe 在画面里找出手上的 21 个点（最多两只手），
//     拇指和食指的指尖捏在一起，就用两指中间当笔尖去擦
// =====================================================================

// 防抖滤波（One Euro Filter）：手慢的时候多平滑一点（不抖），手快的时候少平滑一点（跟得上）
class OneEuroFilter {
  constructor(minCutoff, beta) {
    this.minCutoff = minCutoff; // 手不动时的平滑程度：越小越稳，但也越「拖」
    this.beta = beta;           // 手越快，平滑得越少
    this.reset();
  }
  reset() { this.p = null; }
  filter(x, y, t) { // t：秒
    if (!this.p) {
      this.p = { x, y };
      this.v = { x: 0, y: 0 };
      this.t = t;
      return { x, y };
    }
    const dt = Math.max(0.001, t - this.t);
    this.t = t;
    const alpha = (cutoff) => 1 / (1 + 1 / (2 * Math.PI * cutoff * dt));
    const av = alpha(1); // 速度本身也平滑一下
    this.v.x += av * ((x - this.p.x) / dt - this.v.x);
    this.v.y += av * ((y - this.p.y) / dt - this.v.y);
    const a = alpha(this.minCutoff + this.beta * Math.hypot(this.v.x, this.v.y));
    this.p.x += a * (x - this.p.x);
    this.p.y += a * (y - this.p.y);
    return { x: this.p.x, y: this.p.y };
  }
}

let handLandmarker = null;  // 认手的程序；还没下载好时是 null
let handStatus = 'loading'; // loading = 下载中，ready = 能用了，failed = 失败了
let handFresh = false;      // 摄像头有没有还没认过的新画面
let lastHandTime = 0;       // 上一次识别用的时间戳（MediaPipe 要求它一直变大）
let visionLib = null;       // MediaPipe 的程序库（只下载一次，认手、认脸都用它）
let handsFound = [];        // 这一帧认出来的手（调试面板画点用）

// 每只手一支「笔」，两只手可以同时擦
const pens = [makePen(), makePen()];

function makePen() {
  const make = (className) => { // 屏幕上的小圆圈；辅助书写时还有墨迹小圆点、连着它们的绳子
    const div = document.createElement('div');
    div.className = className;
    document.body.appendChild(div);
    return div;
  };
  return {
    el: make('pen'),
    inkEl: make('ink-dot'),
    ropeEl: make('rope'),
    seen: false,    // 现在画面里有没有这只手
    lostAt: 0,      // 从什么时候开始看不到它
    ratio: 1,       // 捏得多紧：越小越紧（最近三次的中间值，见 pinchParts）
    ratioHist: [],  // 最近三次的捏合数值
    r2: 1, r3: 1,   // 平面、立体两种量法各自的数值（调试面板显示）
    fingers: [1, 1, 1, 1], // 食指、中指、无名指、小指有多直（竖起食指模式用）
    pinched: false, // 现在算不算捏住
    votes: 0,       // 连续几帧「想换状态」：连续 2 帧才真的换，偶尔看错一帧不算
    at: null,       // 这只手在屏幕上的位置（用来分辨哪只手是哪只）
    cam: null,      // 这只手在镜子画面里的位置，0~1（校准表按它来查）
    hand: 'right',  // 是左手还是右手（刚出现时投票决定，见 updatePen）
    tally: { left: 0, right: 0 },
    on: SETTINGS.pinchOn, // 这只手在现在这个位置的「捏住」门槛（见 pinchOnFor）
    pos: null,      // 笔尖在屏幕上的位置（防抖过的）
    shown: null,    // 小圆圈画在哪（比 pos 再顺滑一点）
    filter: new OneEuroFilter(1.5, 0.02),
    stroke: [],     // 这一笔最近的几个笔尖位置
    pausedAt: 0,    // 手指刚开始张开、先停笔的时间（0 = 没停）
    releaseAt: 0,   // 从什么时候开始一直是松开的样子（满 0.2 秒才真的算松手）
    palm: null,     // 手掌的样子：{ straight: 四根手指多直, open: 算不算张开的手掌 }（见 palmShape）
    palmZone: null, // 手掌擦雾的范围：{ x, y, r }（屏幕上，见 handZone）
    palmSince: 0,   // 手掌从什么时候开始一直张开着（0 = 没张开）
    palmOkAt: 0,    // 最后一次看到张开的手掌
    palmOn: false,  // 正在用手掌擦雾（张开满 0.3 秒）
    ink: null,      // 辅助书写时墨迹在哪：被「绳子」拉着走（见 followInk）
    inkShown: null, // 墨迹小圆点画在哪（比 ink 再顺滑一点）
  };
}

loadHands().then(loadFaces); // 页面一打开就在后台下载，不用等点「开始」：先下认手的（大约 8 MB），再下认脸的（大约 4 MB）

function loadVision() {
  if (!visionLib) {
    visionLib = (async () => {
      const lib = await import(`${MP_URL}/vision_bundle.mjs`);
      const fileset = await lib.FilesetResolver.forVisionTasks(`${MP_URL}/wasm`);
      return { lib, fileset };
    })();
  }
  return visionLib;
}

async function loadHands() {
  try {
    const { lib, fileset } = await loadVision();
    const create = (delegate) => lib.HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: HAND_MODEL, delegate },
      runningMode: 'VIDEO',
      numHands: 2,                     // 两只手都认：免得一只手「占着位子」，另一只手认不出来
      minHandDetectionConfidence: 0.4, // 比默认的 0.5 放宽一点，侧着、斜着的手也容易认出来
      minHandPresenceConfidence: 0.3,  // 认出来以后跟得更「黏」：手横过身体、挡在脸前时不容易跟丢
      minTrackingConfidence: 0.3,
    });
    try {
      handLandmarker = await create('GPU'); // 优先用显卡，快
    } catch (err) {
      console.warn('显卡模式用不了，改用 CPU', err);
      handLandmarker = await create('CPU');
    }
    handStatus = 'ready';
  } catch (err) {
    console.error('手势识别加载失败', err);
    handStatus = 'failed';
  }
  if (running) flashHint();
}

// 摄像头每来一张新画面，认一次手
function trackHand(now) {
  const t = Math.max(now, lastHandTime + 1);
  lastHandTime = t;
  let result;
  try {
    result = handLandmarker.detectForVideo(video, t);
  } catch (err) {
    console.error('手势识别出错', err);
    handLandmarker = null;
    handStatus = 'failed';
    flashHint();
    return;
  }
  handsFound = (result.landmarks || []).slice(0, 2).map((lm, i) => {
    const mid = { x: (lm[4].x + lm[8].x) / 2, y: (lm[4].y + lm[8].y) / 2 }; // 两指中间（摄像头原始画面里）
    const tip = drawMode === 'point' && !guide ? lm[8] : mid; // 笔尖：捏住是两指中间，竖起食指是食指尖（校准时总是两指中间）
    const world = result.worldLandmarks && result.worldLandmarks[i];
    const pinch = pinchParts(world, lm);
    const fingers = fingerStraightness(world, lm);
    return {
      lm,
      cam: { x: 1 - tip.x, y: tip.y }, // 在镜子画面里的位置（左右翻转过），0~1
      mirror: toScreen(tip),           // 换算到屏幕上的位置
      ratio: pinch.ratio,
      r2: pinch.r2,                    // 平面量的（调试面板显示）
      r3: pinch.r3,                    // 立体量的
      fingers,
      palm: palmShape(fingers),
      palmZone: handZone(lm),
      hand: handOf(result, i),
    };
  });
  stats.hands++;
  const slot = matchPens(handsFound, now);
  pens.forEach((pen, k) => {
    const i = slot.indexOf(k);
    if (i >= 0) updatePen(pen, handsFound[i], now);
    else penMissing(pen, now);
  });
}

// 这一帧认出的手分别交给哪支笔：在镜子里离哪支笔的手上一次的位置近，就给谁；
// 离两边都很远，就当成刚伸进来的手，交给空着的那支
function matchPens(found, now) {
  const far = 0.3 * Math.hypot(W, H);
  const cost = (h, pen) => (pen.at && (pen.seen || now - pen.lostAt < 250)
    ? Math.hypot(h.mirror.x - pen.at.x, h.mirror.y - pen.at.y)
    : far);
  if (found.length === 1) return [cost(found[0], pens[0]) <= cost(found[0], pens[1]) ? 0 : 1];
  if (found.length === 2) {
    const keep = cost(found[0], pens[0]) + cost(found[1], pens[1]);
    const swap = cost(found[0], pens[1]) + cost(found[1], pens[0]);
    return keep <= swap ? [0, 1] : [1, 0];
  }
  return [];
}

// MediaPipe 说的左右手，就是用户真实的左右手（以前以为要反过来，用户实测：用右手时显示成了「左手」）
function handOf(result, i) {
  const list = result.handedness || result.handednesses || [];
  const name = list[i] && list[i][0] && list[i][0].categoryName;
  return name === 'Left' ? 'left' : name === 'Right' ? 'right' : '';
}

function updatePen(pen, h, now) {
  if (!pen.seen && now - pen.lostAt > 250) { // 手离开过一会儿又回来（可能换了一只手）：从头来
    pen.filter.reset(); // 从新位置开始，别从老地方滑过来
    pen.tally = { left: 0, right: 0 };
    pen.ratioHist = [];
  }
  pen.seen = true;
  pen.at = h.mirror;
  pen.cam = h.cam;
  pen.ratioHist.push(h.ratio); // 捏合数值取最近三次的中间那个：偶尔一帧跳一下（手动得快、画面糊了）不算
  if (pen.ratioHist.length > 3) pen.ratioHist.shift();
  pen.ratio = median(pen.ratioHist);
  pen.r2 = h.r2;
  pen.r3 = h.r3;
  pen.fingers = h.fingers;
  pen.palm = h.palm;
  // 是左手还是右手：刚出现的前 10 帧投票决定，之后不改（手伸到另一边时，识别有时会把左右认错）
  if (h.hand && pen.tally.left + pen.tally.right < 10) pen.tally[h.hand]++;
  pen.hand = pen.tally.left > pen.tally.right ? 'left' : 'right';

  // 笔尖就在两指中间（镜子里你指尖的位置），再防一下抖
  pen.pos = pen.filter.filter(h.mirror.x, h.mirror.y, now / 1000);

  // 校准中：只记数值，不擦雾
  if (guide) {
    guideFeed(pen);
    pen.votes = 0;
    pen.palmSince = 0;
    pen.palmOn = false;
    return;
  }

  // ① 在不在擦：捏住模式看捏合数值（门槛按这只手、这个位置来定，见 pinchOnFor）；
  //    竖起食指模式看手指伸没伸直（见 pointPose）。opening = 这一帧已经不像在擦了：先停笔
  let want, opening;
  if (drawMode === 'point') {
    const p = pointPose(pen.fingers);
    want = pen.pinched ? p.keep : p.start;
    opening = !p.keep;
  } else {
    pen.on = pinchOnFor(pen);
    want = pen.pinched ? pen.ratio <= pen.on + 0.06 : pen.ratio < pen.on;
    opening = pen.ratio > pen.on;
  }
  // ② 擦（开着辅助书写的话，擦的是被「绳子」拉着的墨迹位置，见 followInk）
  if (assistOn && pen.pinched && !pen.pausedAt) followInk(pen);
  if (!pen.pinched) {
    pen.votes = want ? pen.votes + 1 : 0; // 连续 2 帧像在擦才开始，偶尔看错一帧不算
    if (pen.votes >= 2) {
      pen.votes = 0;
      pen.pinched = true;
      pen.pausedAt = 0;
      pen.releaseAt = 0;
      strokeStart(pen);
    }
  } else {
    // 真正松手：要一直是松开的样子 0.2 秒。偶尔几帧数值乱跳（手动得快、画面糊了）只会先停笔，
    // 回来后接着连上，线不会断（以前连续 2 帧就算松手，用户反馈「擦着擦着会断」）
    pen.releaseAt = want ? 0 : pen.releaseAt || now;
    if (pen.releaseAt && now - pen.releaseAt >= 200) {
      pen.pinched = false;
      pen.pausedAt = 0;
      pen.releaseAt = 0;
      strokeEnd(pen);
    } else if (opening) {
      // 手指刚开始张开（数值超过门槛，但还没确定松手）：先停笔，松手时擦痕就不会多拖出一截。
      // 要是只晃了一下又捏紧了，就接着画：停了不到 0.25 秒直接连上，停久了从这里另起一笔
      if (!pen.pausedAt) { // 刚开始张开：把这一刻的位置画上（正好停在张开的地方），然后停笔
        pen.pausedAt = now;
        if (assistOn) pen.ink = { x: pen.pos.x, y: pen.pos.y }; // 辅助书写：墨迹直接连到指尖，这一笔停在手指停下的地方
        strokeAdd(pen);
      }
    } else {
      if (pen.pausedAt && now - pen.pausedAt > 250) {
        strokeEnd(pen);
        strokeStart(pen);
      }
      pen.pausedAt = 0;
      strokeAdd(pen);
    }
  }

  // ③ 手掌张开在雾上抹：手掌下面那一片雾慢慢变淡
  updatePalm(pen, h, now);
}

// ---------- 手掌张开在雾上抹（或者捂着不动）：手掌下面那一片雾慢慢变淡（雾怎么变淡见 thinPalms） ----------
// 张开的手最好认（以前要五指并拢：手指挨在一起时反而认不准，用户反馈「识别不太出来」）。
// 手掌张开满 0.3 秒才开始擦：举手准备捏、手一晃而过的时候不会擦淡。一下子清掉所有雾还是按 X 或点小气泡里的按钮
function updatePalm(pen, h, now) {
  if (!h.palm.open || pen.pinched || pen.ratio < 0.5) { // 不是张开的手掌（或者正在擦、快要捏上）
    if (now - pen.palmOkAt > 200) { // 偶尔几帧认不准不算
      pen.palmSince = 0;
      pen.palmOn = false;
    }
    return;
  }
  pen.palmOkAt = now;
  pen.palmZone = h.palmZone;
  if (!pen.palmSince) pen.palmSince = now;
  pen.palmOn = now - pen.palmSince >= 300;
}

// 手掌擦雾的范围：手腕到中指尖的中点为圆心，半径是这段长度的一半，差不多盖住整只手（手大、离镜头近，范围就大）
function handZone(lm) {
  const a = toScreen(lm[0]), b = toScreen(lm[12]);
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, r: Math.max(30, 0.5 * Math.hypot(b.x - a.x, b.y - a.y)) };
}

// 四根手指（食指、中指、无名指、小指）各自有多直：指根到指尖的直线距离 ÷ 三节长度加起来。
// 伸直时差不多是 1，弯起来就小（握拳大约 0.3~0.5）
function fingerStraightness(world, lm) {
  const P = world || lm.map((p) => ({ x: p.x * video.videoWidth, y: p.y * video.videoHeight, z: 0 }));
  const d = (a, b) => dist3(P[a], P[b]);
  return [5, 9, 13, 17].map((f) => d(f, f + 3) / Math.max(1e-6, d(f, f + 1) + d(f + 1, f + 2) + d(f + 2, f + 3))); // 指根是 5、9、13、17 号点，往上三个点就是这根手指
}

// 手掌是不是张开的：四根手指都伸直（并拢、分开都行，大拇指不管它）
function palmShape(fingers) {
  const straight = Math.min(...fingers);
  return { straight, open: straight > 0.85 };
}

// ---------- 竖起食指写字（小气泡里切换）：食指伸直、中指和无名指弯着就擦；伸出中指（或者食指弯下来）就停 ----------
// 不用捏，所以不怕两个指尖互相挡住、远近猜不准。开始时要求严一点，擦的过程中放宽一点，免得擦着擦着断
function pointPose(f) {
  return {
    start: f[0] > 0.85 && f[1] < 0.7 && f[2] < 0.75,
    keep: f[0] > 0.75 && f[1] < 0.8 && f[2] < 0.85,
  };
}

// ---------- 辅助书写（防抖绳）：墨迹跟在指尖后面一小段，像用一根短绳子拉着笔 ----------
// 指尖在绳子长度以内的抖动（手抖、识别抖）都被吸收掉，墨迹只在绳子拉直时才被拉着走，所以线条平滑；
// 手停住时墨迹慢慢追上指尖（拐弯、停顿的地方不会被「抄近路」切掉）；手指一张开就直接连到指尖（见 updatePen）
function ropeLength() { return clamp(Math.min(W, H) * 0.03, 16, 40); }

function followInk(pen) {
  if (!pen.ink) pen.ink = { x: pen.pos.x, y: pen.pos.y };
  const dx = pen.pos.x - pen.ink.x, dy = pen.pos.y - pen.ink.y;
  const d = Math.hypot(dx, dy), rope = ropeLength();
  const v = pen.filter.v; // 指尖的速度（像素/秒，防抖滤波里算好的）
  // 先看手停没停：防抖滤波停下时会一点点往前挪，要是先判断「绳子拉直」，就永远轮不到追上
  if (d > 0.5 && v && Math.hypot(v.x, v.y) < Math.min(W, H) * 0.05) { // 手差不多停住了：墨迹慢慢追上指尖
    pen.ink = { x: pen.ink.x + dx * 0.25, y: pen.ink.y + dy * 0.25 };
  } else if (d > rope) { // 绳子拉直了：墨迹被拉着走，始终离指尖一根绳子那么远
    pen.ink = { x: pen.ink.x + dx * (d - rope) / d, y: pen.ink.y + dy * (d - rope) / d };
  }
}

function inkOf(pen) { return assistOn && pen.ink ? pen.ink : pen.pos; } // 现在往哪里擦

// ---------- 捏合校准：屏幕上依次出现 9 个圆圈，把手移进去捏紧，记下每处捏紧时的数值 ----------
// 手伸到身体另一边、往下伸时，摄像头是斜着看手的，捏紧时的数值会变大（越靠边越大）；手在自己这一边时又很小。
// 所以一个门槛不够用：校准时屏幕上依次出现 9 个圆圈（左中右 × 上中下），把手移进圆圈、像平时擦雾那样捏住不动，
// 圆圈转满就记下这里捏住时的数值。之后手在哪，就按附近几个点的数值平滑过渡来判断。左右手分开记。
// 点底部小圆圈里的「校准手势」或按 C 开始（不会自动弹出），Esc 跳过，Shift + C 按两次清除
const GRID_COLS = 8, GRID_ROWS = 5, GRID_N = GRID_COLS * GRID_ROWS;  // 校准表：把镜子画面分成 8×5 格
const GUIDE_COLS = [0.15, 0.5, 0.85], GUIDE_ROWS = [0.2, 0.5, 0.82]; // 9 个圆圈在屏幕上的位置（0~1）
const GUIDE_ORDER = [[1, 1], [0, 1], [0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2]]; // [列, 行]：先中间，再绕一圈
const GUIDE_SAMPLES = 24; // 每个圆圈记多少帧（大约 0.8 秒）
let pinchMaps = { left: null, right: null }; // 每只手一张表：{ closed: 每格捏紧时的数值, measured: 这格里有没有圆圈（各 40 格）, ref: 画面正中心的捏紧值 }
let guide = null;     // 正在校准时：{ want: 要校准哪只手（不限就是 null）, hand: 认出的是哪只手, step: 第几个圆圈, samples: 这个圆圈记到的数, results: 做完的圆圈, done: 这只手好了没, doneHands: 这次已经校准好的手 }
let clearArmedAt = 0; // 第一次按 Shift + C 的时间：3 秒内再按一次才真的清除

try { // 上次校准的结果（存在这个浏览器里）
  localStorage.removeItem('fogMirror.pinch');      // 以前几版存的，不再用了
  localStorage.removeItem('fogMirror.pinchCalib');
  localStorage.removeItem('fogMirror.guideSkipped');
  const saved = JSON.parse(localStorage.getItem('fogMirror.pinchMap'));
  // 只认用现在的量法（立体、平面取小的，见 pinchParts）校准的表（metric: 2）。以前只用立体量的表数值偏大，
  // 用了反而不准，要重新校准（每次点「开始」都会带着校准）
  const current = saved && saved.metric === 2;
  for (const hand of ['left', 'right']) {
    const m = current && saved[hand];
    if (!m || !Array.isArray(m.closed) || m.closed.length !== GRID_N) continue;
    // 只认 9 个圆圈引导校准存的表；以前「自由走格子」存的不再用（那只手先用默认设置，等下次校准）
    if (m.V && m.X && m.Y && typeof m.ref === 'number') pinchMaps[hand] = { ...m, measured: m.measured || [] };
  }
} catch (err) { /* 没存过或者存不了，就用默认值 */ }

function savePinchMaps() {
  try { localStorage.setItem('fogMirror.pinchMap', JSON.stringify({ ...pinchMaps, metric: 2 })); } catch (err) { /* 存不了也没关系 */ }
}

function handName(hand) { return hand === 'left' ? '左手' : '右手'; }

function cellOf(p) { // 镜子里的位置（0~1）在第几个格子
  const i = clamp(Math.floor(p.x * GRID_COLS), 0, GRID_COLS - 1);
  const j = clamp(Math.floor(p.y * GRID_ROWS), 0, GRID_ROWS - 1);
  return j * GRID_COLS + i;
}

function cellCenter(k) {
  return { x: (k % GRID_COLS + 0.5) / GRID_COLS, y: (Math.floor(k / GRID_COLS) + 0.5) / GRID_ROWS };
}

// 这只手在现在的位置：数值小于多少算捏住（捏住以后，超过它就先停笔，大于它 + 0.06 才算松开）。
// 画面中间的门槛 = 校准时在中间捏住的数值 + pinchMargin，最多到没校准时的 pinchOn：
// 你捏住时数值本来就小的话，门槛也跟着低，手指张开一点就停，不用张很开（用户反馈过「要张很开才停」）。
// 余量不能太小：校准时人往往捏得用力一些，记下的数偏小，余量太紧的话平时正常捏会认不出、擦着会断（试过 0.03~0.09，不行）。
// 别的位置只看校准表里「这里比画面中间大多少、小多少」：另一边、底部（数值大）门槛跟着放宽；自己这一边（数值小）最多只收紧 0.04
function pinchOnFor(pen) {
  const map = pinchMaps[pen.hand];
  if (!map) return SETTINGS.pinchOn;
  const ref = clamp(map.ref, 0.08, 0.85); // 和 latticeValue 一样限制范围，两边才比得上
  const center = clamp(ref + SETTINGS.pinchMargin, 0.18, SETTINGS.pinchOn);
  return center + clamp(latticeValue(map, pen.cam) - ref, -0.04, 0.4);
}

// 三个点（位置 P、数值 V）之间，位置 t 处的数值：相邻两点之间按距离过渡；
// 最外面的点再往外，按 ext 倍的趋势继续推（0 就是不再变）
function along(P, V, t, ext) {
  if (t <= P[0]) return V[0] + ((V[0] - V[1]) / (P[1] - P[0])) * (P[0] - t) * ext;
  if (t >= P[2]) return V[2] + ((V[2] - V[1]) / (P[2] - P[1])) * (t - P[2]) * ext;
  const i = t < P[1] ? 0 : 1;
  return V[i] + (V[i + 1] - V[i]) * ((t - P[i]) / (P[i + 1] - P[i]));
}

// 9 个点的表里，镜子画面位置 p 处捏紧时的数值：先沿着左右、再沿着上下过渡。
// 左右最外面的点再往外按一半的趋势推（另一边最边上通常还要更大一点）；上下就不推了
function latticeValue(map, p) {
  const rowValues = map.V.map((row) => along(map.X, row, p.x, 0.5));
  return clamp(along(map.Y, rowValues, p.y, 0), 0.08, 0.85);
}

// ---------- 校准的按键和按钮 ----------
const guideEl = $('guide');
const guideTitle = $('guideTitle');
const guideText = $('guideText');
const guideOther = $('guideOther');
const guideSkip = $('guideSkip');
guideSkip.addEventListener('click', () => endGuide());
$('calibBtn').addEventListener('click', (e) => { // 小气泡里的「校准手势」按钮：不用记快捷键
  e.currentTarget.blur(); // 免得之后按空格又「点」了它一下
  if (running && !guide) startGuide();
});
guideOther.addEventListener('click', () => startGuide(guide.hand === 'left' ? 'right' : 'left', guide.doneHands));

window.addEventListener('keydown', (e) => {
  if (!running) return;
  if (e.code === 'Escape' && menuOpen) return setMenu(false);
  if (e.code === 'Escape' && guide) return endGuide();
  if (e.code !== 'KeyC' || e.repeat) return;
  if (e.shiftKey) {
    const now = performance.now();
    if (now - clearArmedAt > 3000) { // 第一次按：只提醒，免得不小心清掉
      clearArmedAt = now;
      flashHint('再按一次 Shift + C，就会清除两只手的校准');
      return;
    }
    clearArmedAt = 0;
    pinchMaps = { left: null, right: null };
    savePinchMaps();
    flashHint('校准已清除：回到默认设置。想重新校准，点下面的小圆圈 →「校准手势」');
    return;
  }
  if (!guide) startGuide();
});

// 以前每次点「开始」都会自动弹出校准；捏合改成立体、平面取小的以后认得准多了，
// 用户说「不用强制一开始弹出，只在菜单里保留就行」，所以现在只有点小气泡里的「校准手势」或按 C 才开始

// doneHands：这次已经校准好的手（校准完一只、接着校准另一只时带过去）
function startGuide(want = null, doneHands = []) {
  setMenu(false);
  for (const p of pens) {
    if (p.pinched) { // 校准时不擦雾
      p.pinched = false;
      strokeEnd(p);
    }
  }
  guide = { want, hand: null, step: 0, samples: [], results: [], done: false, doneHands };
  show(guideEl);
  updateOverlay();
  showGuideText();
}

// 跳过 / 完成
function endGuide() {
  const doneNow = guide.doneHands.length > 0;
  const saved = Boolean(pinchMaps.left || pinchMaps.right);
  guide = null;
  hide(guideEl);
  updateOverlay();
  flashHint(doneNow ? '校准好了，可以开始擦雾了 · 想重新校准，点下面的小圆圈'
    : saved ? '已跳过校准：用上次的校准结果 · 想重新校准，点下面的小圆圈'
    : '已跳过校准：先用默认设置 · 想校准随时点下面的小圆圈');
}

function showGuideText() {
  const other = guide.hand === 'left' ? 'right' : 'left';
  const otherDone = guide.doneHands.includes(other);
  guideSkip.textContent = guide.done ? '完成' : '跳过';
  guideOther.hidden = !guide.done || otherDone;
  guideOther.textContent = `校准${handName(other)}`;
  if (guide.done) {
    guideTitle.textContent = `${handName(guide.hand)}校准好了 ✓`;
    guideText.textContent = otherDone ? '两只手都校准好了，可以开始擦雾了。'
      : `要不要也校准一下${handName(other)}？${pinchMaps[other] ? `（不校准就用${handName(other)}上次的结果）` : ''}`;
  } else if (!guide.hand) {
    guideTitle.textContent = '先花十几秒，校准一下捏合';
    const usesLast = pinchMaps.left || pinchMaps.right ? '（不想校准就点「跳过」，用上次的结果）' : '';
    guideText.textContent = guide.want
      ? `换成${handName(guide.want)}，举到镜头前（${handName(guide.want === 'left' ? 'right' : 'left')}先放下）`
      : `把你平时用来擦雾的那只手举到镜头前${usesLast}`;
  } else {
    guideTitle.textContent = `校准${handName(guide.hand)}（第 ${guide.step + 1}/${GUIDE_ORDER.length} 个圆圈）`;
    guideText.textContent = '把手移进圆圈，像平时擦雾那样捏住（不用特别用力），别动，等圆圈转满一圈';
  }
}

function guideTarget() { // 当前圆圈在屏幕上的位置和大小
  const [c, r] = GUIDE_ORDER[guide.step];
  return { x: GUIDE_COLS[c] * W, y: GUIDE_ROWS[r] * H, r: clamp(Math.min(W, H) * 0.08, 40, 80) };
}

// 校准中：每一帧看手在不在当前的圆圈里、有没有捏紧，是的话就记下数值
function guideFeed(pen) {
  if (guide.done) return;
  if (!guide.hand) { // 还在等手：等这只手的左右投完票（出现 10 帧）再认准它
    if (pen.tally.left + pen.tally.right < 10) return;
    if (guide.want && pen.hand !== guide.want) return;
    guide.hand = pen.hand;
    showGuideText();
  }
  if (pen.hand !== guide.hand) return;
  const t = guideTarget();
  if (Math.hypot(pen.pos.x - t.x, pen.pos.y - t.y) > t.r) return; // 手不在圆圈里
  if (pen.ratio > 0.75) return;                                    // 手指明显张开着，不算
  guide.samples.push({ r: pen.ratio, cam: pen.cam });
  if (guide.samples.length < GUIDE_SAMPLES) return;
  const [c, r] = GUIDE_ORDER[guide.step]; // 这个圆圈做完了
  guide.results.push({
    c, r,
    cam: { x: mean(guide.samples.map((s) => s.cam.x)), y: mean(guide.samples.map((s) => s.cam.y)) },
    v: median(guide.samples.map((s) => s.r)), // 中位数：偶尔一两帧手松了也不影响
  });
  guide.samples = [];
  guide.step++;
  if (guide.step < GUIDE_ORDER.length) return showGuideText();
  pinchMaps[guide.hand] = mapFromGuide(guide.results); // 9 个都做完了
  savePinchMaps();
  guide.done = true;
  if (!guide.doneHands.includes(guide.hand)) guide.doneHands.push(guide.hand);
  showGuideText();
}

// 用 9 个点做出这只手的校准表：X、Y 是三列、三行在镜子画面里的位置，V[行][列] 是那里捏紧时的数值。
// 判断时直接在这 9 个点之间过渡（latticeValue），所以「自己那边涨得慢、另一边涨得快」也跟得上；
// 另外换算出 8×5 格的 closed，只是给调试面板显示用
function mapFromGuide(results) {
  const at = (c, r) => results.find((p) => p.c === c && p.r === r);
  const round2 = (v) => Math.round(v * 1000) / 1000;
  const X = [0, 1, 2].map((c) => round2(mean([0, 1, 2].map((r) => at(c, r).cam.x))));
  const Y = [0, 1, 2].map((r) => round2(mean([0, 1, 2].map((c) => at(c, r).cam.y))));
  const V = [0, 1, 2].map((r) => [0, 1, 2].map((c) => round2(at(c, r).v)));
  const map = { X, Y, V, ref: V[1][1] }; // 参照：正中间那个圆圈测到的数
  map.closed = Array.from({ length: GRID_N }, (_, k) => Math.round(latticeValue(map, cellCenter(k)) * 100) / 100);
  map.measured = new Array(GRID_N).fill(false);
  for (const p of results) map.measured[cellOf(p.cam)] = true;
  return map;
}

// 在透明画布上画当前的圆圈：虚线圈、转满的绿色进度、第几个；做完的圆圈留一个小绿点
function drawGuide() {
  if (!guide || guide.done || !guide.hand) return;
  for (const p of guide.results) {
    dotsCtx.beginPath();
    dotsCtx.arc(GUIDE_COLS[p.c] * W, GUIDE_ROWS[p.r] * H, 6, 0, Math.PI * 2);
    dotsCtx.fillStyle = 'rgba(126, 226, 168, 0.9)';
    dotsCtx.fill();
  }
  const t = guideTarget();
  const pen = pens.find((p) => p.seen && p.hand === guide.hand);
  const inside = pen && Math.hypot(pen.pos.x - t.x, pen.pos.y - t.y) <= t.r;
  dotsCtx.lineWidth = 3;
  dotsCtx.setLineDash([8, 8]);
  dotsCtx.strokeStyle = inside ? 'rgba(255, 255, 255, 0.95)' : 'rgba(255, 255, 255, 0.6)';
  dotsCtx.beginPath();
  dotsCtx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
  dotsCtx.stroke();
  dotsCtx.setLineDash([]);
  const progress = guide.samples.length / GUIDE_SAMPLES;
  if (progress > 0) {
    dotsCtx.lineWidth = 6;
    dotsCtx.strokeStyle = 'rgba(126, 226, 168, 0.95)';
    dotsCtx.beginPath();
    dotsCtx.arc(t.x, t.y, t.r, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
    dotsCtx.stroke();
  }
  dotsCtx.textAlign = 'center';
  dotsCtx.textBaseline = 'middle';
  dotsCtx.fillStyle = 'rgba(255, 255, 255, 0.95)';
  dotsCtx.font = '600 16px -apple-system, "PingFang SC", sans-serif';
  dotsCtx.fillText(`${guide.step + 1}/${GUIDE_ORDER.length}`, t.x, t.y);
  if (inside && pen.ratio > 0.75) { // 手在圈里但手指张着：提醒一下
    dotsCtx.font = '14px -apple-system, "PingFang SC", sans-serif';
    dotsCtx.fillText('捏住手指', t.x, t.y + t.r + 18);
  }
}

function penMissing(pen, now) {
  if (pen.seen) {
    pen.seen = false;
    pen.lostAt = now;
  }
  pen.votes = 0;
  if (now - pen.palmOkAt > 300) { // 手不见了一会儿：手掌擦雾也停下
    pen.palmSince = 0;
    pen.palmOn = false;
  }
  // 短暂看不到（比如手动得太快、画面糊了）先不松开；超过 0.25 秒才算松手
  if (pen.pinched && now - pen.lostAt > 250) {
    pen.pinched = false;
    strokeEnd(pen);
  }
}

// 捏得多紧 = 拇指和食指最前面那一小节之间最近的距离 ÷ 手掌大小，越小越紧。
// 比只量两个指尖更准：指肚贴指肚地捏，指尖不一定碰到，但这两小节一定挨在一起。用两种量法，取小的那个：
// ① 立体：MediaPipe 猜的 3D「真实世界」坐标，÷ 手腕到中指根。手怎么转都量得出，但远近是从平面画面里猜的，
//    手转个角度、手指互相挡住、伸到另一边时常猜错，数值会跳、会变大；
// ② 平面：画面上的位置，÷ 画面里手掌的大小。两个指尖在画面里挨没挨上看得最清楚，不受「猜远近」影响。
// 真捏住的时候至少有一种量法觉得很近，取小的那个，捏紧了就不容易认不出来
// （以前只用立体的，用户反馈「捏紧了还是空心」「擦着擦着会断」「某个位置特别差」）
function pinchParts(world, lm) {
  const flat = lm.map((p) => ({ x: p.x * video.videoWidth, y: p.y * video.videoHeight, z: 0 }));
  const size2 = Math.max(dist3(flat[0], flat[9]), 1.2 * dist3(flat[5], flat[17])); // 画面里手掌多大：长、宽取大的，手往前倾、侧过来都不会算小
  const r2 = tipGap(flat) / Math.max(1e-6, size2);
  const r3 = world ? tipGap(world) / Math.max(1e-6, dist3(world[0], world[9])) : r2;
  return { r2, r3, ratio: Math.min(r2, r3) };
}

function tipGap(P) { // 拇指、食指靠指尖那半节之间最近的距离（握拳时指根那头也会挨着，不能算捏住，所以只看前半节）
  const along = (i, j, s) => ({ // 从 i 号点往 j 号点走 s（0~1）的位置
    x: P[i].x + (P[j].x - P[i].x) * s,
    y: P[i].y + (P[j].y - P[i].y) * s,
    z: P[i].z + (P[j].z - P[i].z) * s,
  });
  let gap = Infinity;
  for (const s of [0.5, 0.75, 1]) {
    for (const u of [0.5, 0.75, 1]) gap = Math.min(gap, dist3(along(3, 4, s), along(7, 8, u)));
  }
  return gap;
}

function dist3(a, b) { return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z); }

// ---------- 手势笔画：把一个个笔尖位置连成平滑的曲线去擦 ----------
function strokeStart(pen) {
  pen.ink = { x: pen.pos.x, y: pen.pos.y }; // 辅助书写的墨迹也从指尖开始
  const p = inkOf(pen);
  pen.stroke = [p];
  userWipe(p.x, p.y, p.x, p.y);
}

// 每来一个新位置，就把「上上个 → 上个」这一段补上。
// 画曲线要知道前后的点，所以擦痕比笔尖晚一帧（大约 0.03 秒，看不出来）
function strokeAdd(pen) {
  const pts = pen.stroke, p = inkOf(pen);
  const last = pts[pts.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) < 1) return; // 几乎没动
  pts.push(p);
  const n = pts.length;
  if (n >= 3) wipeCurve(pts[n - 4] || pts[n - 3], pts[n - 3], pts[n - 2], p);
  if (n > 4) pts.shift();
}

function strokeEnd(pen) { // 松手时把最后一段补完
  const pts = pen.stroke, n = pts.length;
  if (n >= 2) {
    wipeCurve(pts[n - 3] || pts[n - 2], pts[n - 2], pts[n - 1], pts[n - 1]);
    const a = pts[n - 2], b = pts[n - 1], len = Math.hypot(b.x - a.x, b.y - a.y);
    if (len > 0) pushWaterEnd(b.x, b.y, (b.x - a.x) / len, (b.y - a.y) / len); // 往前推的水攒在这一笔的头上
  }
  pen.stroke = [];
}

// 沿着曲线从 b 擦到 c（a、d 是前后的点，决定往哪边弯），
// 切成很多小段，所以拐弯是圆滑的，不是一节一节的折线
function wipeCurve(a, b, c, d) {
  const len = Math.hypot(c.x - b.x, c.y - b.y);
  const steps = Math.max(1, Math.ceil(len / (brushRadius() * 0.25)));
  let prev = b;
  for (let s = 1; s <= steps; s++) {
    const p = catmullRom(a, b, c, d, s / steps);
