    userWipe(prev.x, prev.y, p.x, p.y);
    prev = p;
  }
}

// 「向心 Catmull-Rom」曲线上的一点：u 从 0 到 1，从 p1 走到 p2。
// 「向心」的意思是按点和点距离的平方根来分配，快慢变化大的时候也不会绕出小圈
function catmullRom(p0, p1, p2, p3, u) {
  const k = (p, q) => Math.max(1e-3, Math.sqrt(Math.hypot(q.x - p.x, q.y - p.y)));
  const t1 = k(p0, p1), t2 = t1 + k(p1, p2), t3 = t2 + k(p2, p3);
  const t = t1 + (t2 - t1) * u;
  const mix = (p, q, ta, tb) => {
    const w = (t - ta) / (tb - ta);
    return { x: p.x + (q.x - p.x) * w, y: p.y + (q.y - p.y) * w };
  };
  const a1 = mix(p0, p1, 0, t1), a2 = mix(p1, p2, t1, t2), a3 = mix(p2, p3, t2, t3);
  const b1 = mix(a1, a2, 0, t2), b2 = mix(a2, a3, t1, t3);
  return mix(b1, b2, t1, t2);
}

// 每一帧：把每只手的小圆圈挪到它的笔尖
function drawPens(dt, now) {
  const k = 1 - Math.exp(-dt * 30); // 每帧往笔尖靠近一点：比一秒 30 次的识别结果看起来更顺
  for (const pen of pens) {
    const visible = handStatus === 'ready' && pen.pos && (pen.seen || now - pen.lostAt < 300) && !pen.palmOn;
    pen.el.classList.toggle('show', Boolean(visible));
    // 先停笔超过 0.1 秒就变空心，和擦痕一起停（偶尔一两帧数值跳一下不会闪）
    pen.el.classList.toggle('pinch', pen.pinched && !(pen.pausedAt && now - pen.pausedAt >= 100));
    // 辅助书写、正在写：墨迹小圆点 + 连着指尖的绳子
    const roped = Boolean(visible && assistOn && pen.pinched && !pen.pausedAt && pen.ink);
    pen.inkEl.classList.toggle('show', roped);
    pen.ropeEl.classList.toggle('show', roped);
    if (!visible) {
      pen.shown = null; // 下次出现时直接跳过去，不从老地方滑过来
      pen.inkShown = null;
      continue;
    }
    if (!pen.shown) pen.shown = { x: pen.pos.x, y: pen.pos.y };
    pen.shown.x += (pen.pos.x - pen.shown.x) * k;
    pen.shown.y += (pen.pos.y - pen.shown.y) * k;
    pen.el.style.transform = `translate(${pen.shown.x.toFixed(1)}px, ${pen.shown.y.toFixed(1)}px)`;
    if (!roped) {
      pen.inkShown = null;
      continue;
    }
    if (!pen.inkShown) pen.inkShown = { x: pen.ink.x, y: pen.ink.y };
    pen.inkShown.x += (pen.ink.x - pen.inkShown.x) * k;
    pen.inkShown.y += (pen.ink.y - pen.inkShown.y) * k;
    const ix = pen.inkShown.x, iy = pen.inkShown.y;
    const len = Math.hypot(pen.shown.x - ix, pen.shown.y - iy);
    const angle = Math.atan2(pen.shown.y - iy, pen.shown.x - ix);
    pen.inkEl.style.transform = `translate(${ix.toFixed(1)}px, ${iy.toFixed(1)}px)`;
    pen.ropeEl.style.transform = `translate(${ix.toFixed(1)}px, ${iy.toFixed(1)}px) rotate(${angle.toFixed(3)}rad) scaleX(${len.toFixed(1)})`;
  }
}

// 手掌在擦雾的时候：那只手的小圆圈先藏起来；小气泡里打开了「显示圆圈」的话，
// 画一个淡淡的圆圈圈住正在擦淡的那一片（比识别结果再顺滑一点）
const palmZoneEl = $('palmZone');
let zoneShown = null;
function drawPalmZone(dt) {
  const pen = guide || !zoneRingOn ? null : pens.find((p) => p.palmOn);
  palmZoneEl.classList.toggle('show', Boolean(pen));
  if (!pen) {
    zoneShown = null;
    return;
  }
  const z = pen.palmZone;
  if (!zoneShown) zoneShown = { x: z.x, y: z.y, r: z.r };
  const k = 1 - Math.exp(-dt * 20);
  zoneShown.x += (z.x - zoneShown.x) * k;
  zoneShown.y += (z.y - zoneShown.y) * k;
  zoneShown.r += (z.r - zoneShown.r) * k;
  const { x, y, r } = zoneShown;
  palmZoneEl.style.width = palmZoneEl.style.height = `${Math.round(2 * r)}px`;
  palmZoneEl.style.transform = `translate(${(x - r).toFixed(1)}px, ${(y - r).toFixed(1)}px)`;
}

// 「铺满裁切」：摄像头画面等比放大到刚好盖满窗口，多出来的边切掉，所以不会变形
function coverFit() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(W / vw, H / vh);
  const dw = vw * s, dh = vh * s;
  return { dw, dh, ox: (W - dw) / 2, oy: (H - dh) / 2 };
}

// 识别结果的坐标（相对于摄像头原始画面，0~1）→ 屏幕上的位置。
// x 要翻转，因为屏幕上显示的是镜像：手往右移，笔尖也往右
function toScreen(p) {
  const c = coverFit();
  return { x: c.ox + (1 - p.x) * c.dw, y: c.oy + p.y * c.dh };
}

// =====================================================================
//  4b. 哈气起雾：MediaPipe 认脸，看嘴张多大、脸离镜头多近。
//      张着嘴、脸靠近镜头，保持半秒，就从嘴的位置往外长雾（雾怎么长见 updateFog）
// =====================================================================
let faceLandmarker = null;  // 认脸的程序；还没下载好时是 null
let faceStatus = 'loading'; // loading = 下载中，ready = 能用了，failed = 失败了
let faceFresh = false;      // 摄像头有没有还没认过脸的新画面
let lastFaceTime = 0;       // 上一次认脸用的时间戳（和认手分开算，MediaPipe 要求它一直变大）
let face = null;            // 这一次认出来的脸（没认出来是 null），见 trackFace

// 认手的下载好以后再下载这个，先让擦雾能用
async function loadFaces() {
  try {
    const { lib, fileset } = await loadVision();
    const create = (delegate) => lib.FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: FACE_MODEL, delegate },
      runningMode: 'VIDEO',
      numFaces: 1,
      outputFaceBlendshapes: true, // 要它算出「嘴张多大、笑没笑」这些表情数值
    });
    try {
      faceLandmarker = await create('GPU');
    } catch (err) {
      console.warn('认脸：显卡模式用不了，改用 CPU', err);
      faceLandmarker = await create('CPU');
    }
    faceStatus = 'ready';
  } catch (err) {
    console.error('认脸加载失败', err);
    faceStatus = 'failed';
  }
  if (running) flashHint();
}

// 认一次脸：嘴张多大、笑没笑、脸多大、嘴在屏幕上哪里
function trackFace(now) {
  const t = Math.max(now, lastFaceTime + 1);
  lastFaceTime = t;
  faceFresh = false;
  let result;
  try {
    result = faceLandmarker.detectForVideo(video, t);
  } catch (err) {
    console.error('认脸出错', err);
    faceLandmarker = null;
    faceStatus = 'failed';
    face = null;
    flashHint();
    return;
  }
  stats.faces++;
  const lm = result.faceLandmarks && result.faceLandmarks[0];
  const shapes = result.faceBlendshapes && result.faceBlendshapes[0];
  face = null;
  if (lm && shapes) {
    const score = {}; // 52 种表情，每种 0~1
    for (const c of shapes.categories) score[c.categoryName] = c.score;
    let minX = 1, maxX = 0;
    for (const p of lm) {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
    }
    const jaw = score.jawOpen || 0, funnel = score.mouthFunnel || 0;
    face = {
      jaw,                          // 下巴往下张开多少
      funnel,                       // 嘴唇撅成 O 形多少
      open: Math.max(jaw, funnel),  // 嘴张多大：张大嘴「哈——」、撅成 O 形「呼——」都算
      smile: Math.max(score.mouthSmileLeft || 0, score.mouthSmileRight || 0),
      eyesClosed: ((score.eyeBlinkLeft || 0) + (score.eyeBlinkRight || 0)) / 2,
      size: maxX - minX,            // 脸的宽度 ÷ 画面宽度：越靠近镜头越大
      mouth: toScreen({ x: (lm[13].x + lm[14].x) / 2, y: (lm[13].y + lm[14].y) / 2 }), // 上下嘴唇中间（13、14 号点）
    };
  }
  updateBreath(now);
}

// ---------- 哈气：嘴张开 + 脸靠近镜头 + 保持半秒，才算「哈气中」 ----------
const breath = {
  on: false,  // 现在算不算哈气中
  since: 0,   // 从什么时候开始一直满足条件（满 breathHold 才算哈气）
  okAt: 0,    // 最后一次满足条件的时间
  level: 0,   // 雾扩得多远（0~1）：哈得越久越大，停下后慢慢缩回去（见 updateFog）
  at: null,   // 嘴在屏幕上的位置（平滑过的），雾从这里长出来
};

// 这张脸现在是不是「哈气」的样子
function breathPose(f) {
  if (!f) return false;
  if (breath.on) { // 已经在哈气了：放宽一点，嘴稍微动一下、头稍微往后一点不会断
    return f.open >= SETTINGS.breathOpen - 0.08 && f.size >= SETTINGS.breathClose * 0.9 && f.smile < 0.6;
  }
  return f.open >= SETTINGS.breathOpen
    && f.size >= SETTINGS.breathClose
    && f.smile < 0.5                            // 张着嘴大笑不算
    && !(f.open > 0.75 && f.eyesClosed > 0.5);  // 嘴张得特别大、眼睛又眯着：多半是在打哈欠
}

function updateBreath(now) {
  if (breathPose(face)) {
    breath.okAt = now;
    if (!breath.since) breath.since = now;
    if (now - breath.since >= SETTINGS.breathHold) breath.on = true;
    const m = face.mouth;
    breath.at = breath.at // 平滑一下，嘴的位置不抖
      ? { x: breath.at.x + (m.x - breath.at.x) * 0.5, y: breath.at.y + (m.y - breath.at.y) * 0.5 }
      : { x: m.x, y: m.y };
  } else if (!breath.on || now - breath.okAt > 200) {
    // 还没开始哈气时，一不满足就从头数（说话时嘴一张一合，凑不满半秒）；
    // 已经在哈气了，0.2 秒以内偶尔没对上不算停
    breath.on = false;
    breath.since = 0;
  }
}

// 哈气时雾扩到最远要哈多久：跟着浓度变，浓度越低雾越薄、起得越快（浓度 60% 时大约 7.5 秒，可以分几口气哈）
function breathSpreadTime() { return refogTime() * 2.5; }

// 这口气的雾现在最远长到哪（像素）：刚开始是嘴边一小片，哈得越久越远，最远超过整面镜子
function breathReach() {
  const r0 = Math.min(W, H) * 0.1;
  return r0 + (Math.hypot(W, H) * 1.4 - r0) * breath.level;
}

// =====================================================================
//  5. WebGL：把「清晰镜像」和「磨砂镜像」按雾的浓度混在一起
// =====================================================================
let gl = null;
let P = null;         // 几个着色器程序（在显卡上跑的小程序）
let videoTex = null;  // 摄像头画面（显卡里的一份）
let maskTex = null;   // 雾浓度表（显卡里的一份）
let T = null;         // 几张缩小的中间画面，用来做模糊

const VERT = `
attribute vec2 aPos;
varying vec2 vUv;   // 0~1，左下角是 (0,0)（WebGL 的习惯）
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FRAG_HEAD = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
`;

// 从摄像头画面里取颜色：先「铺满裁切」，再左右翻转，就成了镜子
const MIRROR_GLSL = `
uniform sampler2D uVideo;
uniform vec2 uVidScale;
uniform vec2 uVidOffset;
vec3 mirrorAt(vec2 st) {   // st：屏幕上的位置，0~1，左上角是 (0,0)
  vec2 d = (st - uVidOffset) * uVidScale;
  return texture2D(uVideo, vec2(1.0 - d.x, d.y)).rgb;
}`;

const FRAG = {
  // ① 摄像头画面 → 缩到 1/4 大小（每个点取 4 个样本平均，免得画面闪）
  videoDown: MIRROR_GLSL + `
uniform vec2 uTexel;
void main() {
  vec2 st = vec2(vUv.x, 1.0 - vUv.y);
  vec2 h = uTexel * 0.25;
  vec3 c = mirrorAt(st + vec2(-h.x, -h.y)) + mirrorAt(st + vec2(h.x, -h.y))
         + mirrorAt(st + vec2(-h.x,  h.y)) + mirrorAt(st + vec2(h.x,  h.y));
  gl_FragColor = vec4(c * 0.25, 1.0);
}`,

  // ② 再缩小一半
  down: `
uniform sampler2D uSrc;
uniform vec2 uSrcTexel;
void main() {
  vec2 o = uSrcTexel;
  vec3 c = texture2D(uSrc, vUv + vec2(-o.x, -o.y)).rgb + texture2D(uSrc, vUv + vec2(o.x, -o.y)).rgb
         + texture2D(uSrc, vUv + vec2(-o.x,  o.y)).rgb + texture2D(uSrc, vUv + vec2(o.x,  o.y)).rgb;
  gl_FragColor = vec4(c * 0.25, 1.0);
}`,

  // ③ 高斯模糊：一次只沿一个方向糊，横着一遍、竖着一遍，合起来就是一整圈
  blur: `
uniform sampler2D uSrc;
uniform vec2 uStep;
void main() {
  vec3 c = texture2D(uSrc, vUv).rgb * 0.2270270270;
  c += (texture2D(uSrc, vUv + uStep * 1.3846153846).rgb + texture2D(uSrc, vUv - uStep * 1.3846153846).rgb) * 0.3162162162;
  c += (texture2D(uSrc, vUv + uStep * 3.2307692308).rgb + texture2D(uSrc, vUv - uStep * 3.2307692308).rgb) * 0.0702702703;
  gl_FragColor = vec4(c, 1.0);
}`,

  // ④ 合成：清晰镜像 + 磨砂镜像，按雾浓度混合，画到屏幕上
  composite: MIRROR_GLSL + `
uniform sampler2D uMask;
uniform sampler2D uBlurA;
uniform sampler2D uBlurB;
uniform vec2 uMaskScale;
uniform vec2 uScreen;
uniform vec2 uTexelA;
uniform vec2 uTexelB;
uniform vec2 uMaskTexel;
uniform float uDensity;  // 底部滑条：雾的浓度 0~1

// 给每个位置一个固定的随机数 0~1
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
// 平滑起伏的随机图案，用来让雾的薄厚不那么均匀
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x),
             mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y);
}
// 小图放大时取 4 个点平均，放大后更顺滑
vec3 smoothTex(sampler2D t, vec2 uv, vec2 texel) {
  vec2 o = texel * 0.5;
  return 0.25 * (texture2D(t, uv + vec2(-o.x, -o.y)).rgb + texture2D(t, uv + vec2(o.x, -o.y)).rgb
               + texture2D(t, uv + vec2(-o.x,  o.y)).rgb + texture2D(t, uv + vec2(o.x,  o.y)).rgb);
}
// 雾浓度表放大到屏幕时也取 4 个点平均，擦痕边缘的过渡更顺滑
float maskAt(vec2 st) {
  vec2 uv = st * uMaskScale;
  vec2 o = uMaskTexel * 0.5;
  return 0.25 * (texture2D(uMask, uv + vec2(-o.x, -o.y)).r + texture2D(uMask, uv + vec2(o.x, -o.y)).r
               + texture2D(uMask, uv + vec2(-o.x,  o.y)).r + texture2D(uMask, uv + vec2(o.x,  o.y)).r);
}

void main() {
  vec2 st = vec2(vUv.x, 1.0 - vUv.y);
  vec3 sharp = mirrorAt(st);                                    // 清晰镜像
  // 这里的雾有多浓：0~1。滑条调低时，最浓的雾也只是一层薄雾
  float m = maskAt(st) * min(1.0, 0.3 + 1.2 * uDensity);
  if (m < 0.004) { gl_FragColor = vec4(sharp, 1.0); return; }

  // 雾越浓越模糊：薄雾用轻模糊，浓雾用重模糊（最浓时也留一点轻模糊，影子不至于全糊掉）
  vec3 light = smoothTex(uBlurA, vUv, uTexelA);
  vec3 heavy = smoothTex(uBlurB, vUv, uTexelB);
  vec3 blurred = mix(light, heavy, 0.85 * smoothstep(0.15, 0.8, m));

  // 水蒸气：一层发亮的白纱，一团厚一团薄，像浴室里的水汽
  vec2 px = st * uScreen;
  float cloud = 0.7 * vnoise(px / 240.0) + 0.3 * vnoise(px / 95.0);        // 大团的云絮，很柔，没有颗粒
  float ambient = dot(heavy, vec3(0.299, 0.587, 0.114));
  vec3 steam = vec3(0.93, 0.95, 0.98) * (0.72 + 0.26 * ambient);           // 水汽本身是亮的，周围越亮越亮
  float veil = (0.22 + 0.3 * m) * (0.15 + 0.85 * uDensity) * (0.5 + 1.0 * cloud); // 白纱有多厚（各处厚薄不一）
  vec3 frosted = mix(blurred, steam, veil);
  frosted += max(blurred - 0.5, 0.0) * 0.35 * m;                            // 亮的地方在雾里晕开，有点发光
  frosted = mix(vec3(dot(frosted, vec3(0.299, 0.587, 0.114))), frosted, 0.85); // 颜色淡一点
  frosted += (hash12(gl_FragCoord.xy) - 0.5) / 255.0; // 极轻的抖动，眼睛看不出来，只是免得渐变出现一圈圈色带

  gl_FragColor = vec4(mix(sharp, frosted, smoothstep(0.0, 0.6, m)), 1.0);
}`,
};

function initGL() {
  if (gl) return true;
  const opts = { alpha: false, antialias: false, depth: false, stencil: false };
  gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
  if (!gl) return false;
  try {
    P = {
      videoDown: makeProgram(FRAG.videoDown),
      down: makeProgram(FRAG.down),
      blur: makeProgram(FRAG.blur),
      composite: makeProgram(FRAG.composite),
    };
  } catch (err) {
    console.error(err);
    gl = null;
    return false;
  }
  const buf = gl.createBuffer(); // 一个盖住整个画面的大三角形
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

  videoTex = makeTexture();
  maskTex = makeTexture();
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    running = false;
    showProblem('lost');
  });
  resize();
  window.addEventListener('resize', resize);
  return true;
}

function makeProgram(fragSource) {
  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG_HEAD + fragSource));
  gl.bindAttribLocation(program, 0, 'aPos');
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  const loc = {}; // 记下每个参数（uniform）在显卡上的位置
  const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const name = gl.getActiveUniform(program, i).name;
    loc[name] = gl.getUniformLocation(program, name);
  }
  return { program, loc };
}

function makeTexture() {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

// 一张可以往上画的中间画面（在显卡里）
function makeTarget(w, h) {
  const tex = makeTexture();
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fb, w, h };
}

// 用某个程序画一遍。target 是要画到哪张中间画面上；null 表示直接画到屏幕上
function pass(prog, target, textures, values) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, target ? target.w : canvas.width, target ? target.h : canvas.height);
  gl.useProgram(prog.program);
  let unit = 0;
  for (const name in textures) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, textures[name]);
    gl.uniform1i(prog.loc[name], unit);
    unit++;
  }
  for (const name in values) { // 参数要么是一个数，要么是两个数一组
    const v = values[name];
    if (typeof v === 'number') gl.uniform1f(prog.loc[name], v);
    else gl.uniform2f(prog.loc[name], v[0], v[1]);
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// 窗口大小变了：画布、雾浓度表、中间画面都跟着变
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  resizeFog();
  if (T) for (const k in T) { gl.deleteTexture(T[k].tex); gl.deleteFramebuffer(T[k].fb); }
  const size = (n) => [Math.max(1, Math.ceil(W / n)), Math.max(1, Math.ceil(H / n))];
  T = {
    quarter: makeTarget(...size(4)),                         // 1/4 大小的镜像
    a: makeTarget(...size(8)), aTmp: makeTarget(...size(8)), // 1/8 大小：轻模糊
    b: makeTarget(...size(16)), bTmp: makeTarget(...size(16)), // 1/16 大小：重模糊
  };
  videoFresh = true;
}

// 横着糊一遍（t → tmp），再竖着糊一遍（tmp → t）
function blur(t, tmp, spread) {
  pass(P.blur, tmp, { uSrc: t.tex }, { uStep: [spread / t.w, 0] });
  pass(P.blur, t, { uSrc: tmp.tex }, { uStep: [0, spread / t.h] });
}

// 用最新的摄像头画面，重新做两份模糊的镜像
function updateBlur(mirror) {
  const { quarter, a, aTmp, b, bTmp } = T;
  pass(P.videoDown, quarter, { uVideo: videoTex }, { ...mirror, uTexel: [1 / quarter.w, 1 / quarter.h] });
  pass(P.down, a, { uSrc: quarter.tex }, { uSrcTexel: [1 / quarter.w, 1 / quarter.h] });
  blur(a, aTmp, 1.5);                 // 轻模糊
  pass(P.down, b, { uSrc: a.tex }, { uSrcTexel: [1 / a.w, 1 / a.h] });
  blur(b, bTmp, 1.6);                 // 重模糊：再缩小、再糊两轮
  blur(b, bTmp, 1.6);
}

// 摄像头一秒大约 30 张新画面，屏幕一秒刷新 60 次以上。
// 只在有新画面时才重新做模糊，省电。
const canWatchFrames = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
let videoFresh = true;
let lastVideoAt = 0;
let watching = false;

function watchVideoFrames() {
  if (!canWatchFrames || watching) return;
  watching = true;
  const onFrame = () => {
    videoFresh = true;
    handFresh = true;
    faceFresh = true;
    video.requestVideoFrameCallback(onFrame);
  };
  video.requestVideoFrameCallback(onFrame);
}

function draw(now) {
  if (!video.videoWidth || !video.videoHeight) return;
  const c = coverFit();
  const mirror = { uVidScale: [W / c.dw, H / c.dh], uVidOffset: [c.ox / W, c.oy / H] };

  const overdue = now - lastVideoAt > 100; // 万一「新画面通知」没来，最多 0.1 秒也更新一次
  if (!canWatchFrames || videoFresh || overdue) {
    if (overdue) handFresh = faceFresh = true;
    videoFresh = false;
    lastVideoAt = now;
    gl.bindTexture(gl.TEXTURE_2D, videoTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
    updateBlur(mirror);
  }

  // 把最新的雾浓度表交给显卡
  gl.bindTexture(gl.TEXTURE_2D, maskTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, fog.w, fog.h, gl.LUMINANCE, gl.UNSIGNED_BYTE, fog.bytes);

  pass(P.composite, null,
    { uVideo: videoTex, uMask: maskTex, uBlurA: T.a.tex, uBlurB: T.b.tex },
    {
      ...mirror,
      uMaskScale: [W / (CELL * fog.w), H / (CELL * fog.h)],
      uScreen: [W, H],
      uTexelA: [1 / T.a.w, 1 / T.a.h],
      uTexelB: [1 / T.b.w, 1 / T.b.h],
      uMaskTexel: [1 / fog.w, 1 / fog.h],
      uDensity: SETTINGS.fogDensity,
    });
}

// =====================================================================
//  6. 每一帧：认手、认脸 → 更新雾 → 画画面 → 挪小圆圈
// =====================================================================
let lastT = 0;
function loop(now) {
  if (!running) return;
  // 离上一帧过了几秒（切到别的窗口再回来时，最多按 0.1 秒算，雾不会一下子散光）
  const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0;
  lastT = now;
  clock = now;
  // 摄像头有新画面才认手（不支持「新画面通知」的浏览器，就每 33 毫秒认一次）。
  // 认脸不用那么勤（一秒十几次就够），而且和认手错开在不同的帧里做，一帧里的活儿不会太多
  const handDue = canWatchFrames ? handFresh : now - lastHandTime > 33;
  const faceDue = faceLandmarker && (!canWatchFrames || faceFresh) && now - lastFaceTime > 60;
  if (handLandmarker && handDue) {
    handFresh = false;
    trackHand(now);
    if (faceDue && now - lastFaceTime > 90) trackFace(now); // 屏幕一秒只刷新 30 次（比如省电模式）、每一帧都在认手时，也保证一秒认 10 次脸
  } else if (faceDue) {
    trackFace(now);
  }
  if (breath.on && now - breath.okAt > 300) { // 认脸停了（出错、没下载好）：别一直起雾
    breath.on = false;
    breath.since = 0;
  }
  updateWater(dt); // 先让水珠流：流过的地方冲掉的雾，这一帧就画出来
  thinPalms(dt);   // 手掌下面的雾慢慢变淡
  updateFog(dt);
  draw(now);
  drawWater(now);
  captureFrame(); // 截屏、录屏：镜子画面只有刚画完的这一刻能取
  drawPens(dt, now);
  drawPalmZone(dt);
  updateDebug(now);
  if (debugOn || guide) drawDots(); // 手上的小点、校准圆圈：每帧重画，动起来才顺
  requestAnimationFrame(loop);
}

// =====================================================================
//  7. 调试面板（按 D 开关）：看实时数值、看认出来的手，方便调灵敏度
// =====================================================================
const debugEl = $('debug');
const debugRows = $('debugRows');
const dots = $('debugDots');
const dotsCtx = dots.getContext('2d');
let debugOn = false;
let lastDebugAt = 0;
const stats = { since: 0, frames: 0, hands: 0, faces: 0, fps: 0, handRate: 0, faceRate: 0 }; // 数一数每秒画了几帧、认了几次手和脸

window.addEventListener('keydown', (e) => {
  if (e.code !== 'KeyD' || e.repeat) return;
  debugOn = !debugOn;
  debugEl.classList.toggle('hidden', !debugOn);
  updateOverlay();
  if (debugOn) renderDebug();
});

// 透明画布（手上的小点、校准格子）：调试面板开着、或者正在校准时才显示
function updateOverlay() {
  dots.classList.toggle('hidden', !(debugOn || guide));
  if (debugOn || guide) drawDots();
}

function updateDebug(now) {
  stats.frames++;
  if (now - stats.since >= 500) { // 每半秒算一次「每秒多少次」
    const sec = (now - stats.since) / 1000;
    stats.fps = Math.round(stats.frames / sec);
    stats.handRate = Math.round(stats.hands / sec);
    stats.faceRate = Math.round(stats.faces / sec);
    stats.frames = 0;
    stats.hands = 0;
    stats.faces = 0;
    stats.since = now;
  }
  if (debugOn && now - lastDebugAt > 100) { // 数字一秒刷新 10 次，再快就看不清了
    lastDebugAt = now;
    renderDebug(now);
  }
}

function mapInfo(map) { return map ? `已校准（实测 ${map.measured.filter(Boolean).length} 格）` : '未校准'; }

function renderDebug(now = performance.now()) {
  const loadText = (status, rate) => (status === 'ready' ? `${rate} 次/秒` : status === 'loading' ? '加载中…' : '加载失败');
  const breathText = breath.on ? `<span class="yes">哈气中</span> · 雾扩到 ${Math.round(breath.level * 100)}%`
    : breath.since ? `准备中（再保持 ${Math.max(0, (SETTINGS.breathHold - (now - breath.since)) / 1000).toFixed(1)} 秒）`
    : '没有';
  const handText = (pen) => {
    if (!pen.seen) return '—';
    if (drawMode === 'point') {
      const f = pen.fingers;
      return `${handName(pen.hand)} 食指 ${f[0].toFixed(2)} · 中指 ${f[1].toFixed(2)} · 无名指 ${f[2].toFixed(2)} · ${pen.pinched ? '<span class="yes">在擦</span>' : '没擦'}`;
    }
    return `${handName(pen.hand)} ${pen.ratio.toFixed(2)}（立体 ${pen.r3.toFixed(2)} · 平面 ${pen.r2.toFixed(2)}）· `
      + `${pen.pinched ? '<span class="yes">捏住</span>' : '没捏'}（门槛 ${pen.on.toFixed(2)}）`;
  };
  const palmText = (pen) => (pen.seen && pen.palm
    ? `伸直 ${pen.palm.straight.toFixed(2)} · ${pen.palm.open ? '<span class="yes">手掌张开</span>' : '不算'}${pen.palmOn ? ` · 正在擦淡（半径 ${Math.round(pen.palmZone.r)} 像素）` : ''}`
    : '—');
  const rows = [
    ['帧率', `${stats.fps} 帧/秒`],
    ['认手', loadText(handStatus, stats.handRate)],
    ['认脸', loadText(faceStatus, stats.faceRate)],
    ['嘴张开', face ? `${face.open.toFixed(2)}（要 ≥ ${SETTINGS.breathOpen.toFixed(2)}）· 张嘴 ${face.jaw.toFixed(2)} · 撅嘴 ${face.funnel.toFixed(2)}` : '没认出脸'],
    ['笑', face ? `${face.smile.toFixed(2)}（大于 0.50 不算哈气）` : '—'],
    ['脸的大小', face ? `${face.size.toFixed(2)}（要 ≥ ${SETTINGS.breathClose.toFixed(2)}，越靠近镜头越大）` : '—'],
    ['哈气', breathText],
    ['画面里的手', `${handsFound.length} 只`],
    ['擦雾手势', drawMode === 'point'
      ? '竖起食指：食指伸直 > 0.85、中指 < 0.70、无名指 < 0.75 开始擦；擦着时食指 < 0.75 或中指 > 0.80 就停'
      : '捏住：立体、平面两种量法取小的，再取最近三次的中间值'],
    ['手 1', handText(pens[0])],
    ['手 2', handText(pens[1])],
    ['手 1 手掌', palmText(pens[0])],
    ['手 2 手掌', palmText(pens[1])],
    ['手掌擦雾', `伸直大于 0.85 算手掌张开，张开 0.3 秒后手掌下面的雾慢慢变淡，一处 ${SETTINGS.palmSeconds.toFixed(1)} 秒擦干净`],
    ['辅助书写', assistOn ? `开（绳长 ${Math.round(ropeLength())} 像素）` : '关'],
    ['捏合校准', `右手${mapInfo(pinchMaps.right)} · 左手${mapInfo(pinchMaps.left)}`],
    ['水珠', dropsOn ? `${water.drops.length} 颗 · 正在往下流 ${water.drips.length} 道` : '关着'],
    ['反转', inverted ? '反转着（雾做的字）· 再按 I 换回来' : '没有（按 I 反转）'],
    ['快捷键', 'S 截屏 · R 录屏 · X 清除所有雾 · 空格 整面起雾（测试用）· C 重新校准 · Esc 跳过 · Shift+C 按两次清除校准'],
  ];
  debugRows.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
}

// 透明画布上画：校准时的圆圈；调试时再画校准表（每格的数值）和认出来的手上的小点
// （绿点是手上的 21 个点，黄点是拇指尖和食指尖）
function drawDots() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(W * dpr), h = Math.round(H * dpr);
  if (dots.width !== w || dots.height !== h) {
    dots.width = w;
    dots.height = h;
  }
  dotsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dotsCtx.clearRect(0, 0, W, H);
  drawGuide();
  if (!debugOn) return;
  drawGrid();
  if (face) { // 嘴的位置：蓝点，哈气中变绿
    dotsCtx.beginPath();
    dotsCtx.arc(face.mouth.x, face.mouth.y, 7, 0, Math.PI * 2);
    dotsCtx.fillStyle = breath.on ? 'rgba(126, 226, 168, 0.95)' : 'rgba(108, 196, 255, 0.95)';
    dotsCtx.fill();
  }
  if (breath.on && breath.at) { // 哈气中：虚线圈是这口气的雾现在最远长到哪
    dotsCtx.lineWidth = 2;
    dotsCtx.setLineDash([6, 8]);
    dotsCtx.strokeStyle = 'rgba(126, 226, 168, 0.8)';
    dotsCtx.beginPath();
    dotsCtx.arc(breath.at.x, breath.at.y, breathReach(), 0, Math.PI * 2);
    dotsCtx.stroke();
    dotsCtx.setLineDash([]);
  }
  for (const { lm } of handsFound) {
    lm.forEach((p, i) => {
      const s = toScreen(p);
      const tip = i === 4 || i === 8;
      dotsCtx.beginPath();
      dotsCtx.arc(s.x, s.y, tip ? 5 : 3, 0, Math.PI * 2);
      dotsCtx.fillStyle = tip ? '#ffd166' : 'rgba(126, 226, 168, 0.9)';
      dotsCtx.fill();
    });
  }
}

// 调试时：画出画面里这只手的校准表，每格写上它捏紧时的数值（白字是圆圈所在的格子，灰字是推算的）
function drawGrid() {
  const seenPen = pens.find((p) => p.seen);
  const map = seenPen && !guide ? pinchMaps[seenPen.hand] : null;
  if (!map) return;
  dotsCtx.font = '12px -apple-system, "PingFang SC", sans-serif';
  dotsCtx.textAlign = 'center';
  dotsCtx.textBaseline = 'middle';
  dotsCtx.lineWidth = 1;
  dotsCtx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
  for (let k = 0; k < GRID_N; k++) {
    const i = k % GRID_COLS, j = Math.floor(k / GRID_COLS);
    const a = toScreen({ x: 1 - i / GRID_COLS, y: j / GRID_ROWS });             // 格子左上角
    const b = toScreen({ x: 1 - (i + 1) / GRID_COLS, y: (j + 1) / GRID_ROWS }); // 格子右下角
    dotsCtx.strokeRect(a.x + 0.5, a.y + 0.5, b.x - a.x - 1, b.y - a.y - 1);
    dotsCtx.fillStyle = map.measured[k] ? 'rgba(255, 255, 255, 0.9)' : 'rgba(255, 255, 255, 0.45)';
    dotsCtx.fillText(map.closed[k].toFixed(2), (a.x + b.x) / 2, (a.y + b.y) / 2);
  }
}

// =====================================================================
//  8. 截屏（S）和录屏（R，再按一次停）：只有镜子、雾和水珠（不带小圆圈、按钮、提示）。
//     存到用户选的文件夹里（第一次选一下，以后直接存）：网页不能自己往桌面写文件，
//     Chrome 也不让网页用整个桌面，所以请用户在桌面上新建一个「雾镜作品」文件夹选中它。
//     Safari 不支持选文件夹，就按普通下载存到「下载」
// =====================================================================
const shot = document.createElement('canvas'); // 镜子画面和水珠合到这一张上，再存成图片、视频
const shotCtx = shot.getContext('2d');
const recBadge = $('recBadge');
const flashEl = $('flash');
let shotWanted = false;   // 按了 S：这一帧画完就截
let recordWanted = false; // 按了 R：这一帧画完就开始录
let recorder = null;      // 正在录屏时：MediaRecorder
let recordStart = 0;
let saveDir = null;       // 存到哪个文件夹（选过一次就记住，存在 IndexedDB 里，刷新页面也记得）

window.addEventListener('keydown', (e) => {
  if (!running || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return; // Command+S 之类的不算
  if (e.code === 'KeyS') shotWanted = true;
  if (e.code === 'KeyR') {
    if (recorder) recorder.stop();
    else recordWanted = true;
  }
});

// 每一帧画完之后：要截屏、正在录屏的话，把镜子画面和水珠合成一张
function captureFrame() {
  if (!shotWanted && !recordWanted && !recorder) return;
  const scale = Math.min(1, 1920 / Math.max(canvas.width, canvas.height)); // 最长边不超过 1920，录屏才不会卡
  const w = Math.round(canvas.width * scale), h = Math.round(canvas.height * scale);
  if (shot.width !== w || shot.height !== h) {
    shot.width = w;
    shot.height = h;
  }
  shotCtx.drawImage(canvas, 0, 0, w, h);
  shotCtx.drawImage(waterCanvas, 0, 0, w, h);
  if (shotWanted) {
    shotWanted = false;
    flashEl.classList.add('on'); // 屏幕白闪一下：截到了
    setTimeout(() => flashEl.classList.remove('on'), 60);
    shot.toBlob((blob) => { if (blob) saveFile(blob, `雾镜-${timeStamp()}.png`, '截屏'); }, 'image/png');
  }
  if (recordWanted) {
    recordWanted = false;
    startRecording();
  }
  if (recorder) recBadge.textContent = `录屏中 ${formatTime(clock - recordStart)} · 按 R 停止`;
}

function startRecording() {
  if (!shot.captureStream || !window.MediaRecorder) {
    flashHint('这个浏览器不支持录屏');
    return;
  }
  // 能存 MP4 就存 MP4（Mac 上直接能放）；不行再存 WebM
  const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find((t) => MediaRecorder.isTypeSupported(t));
  let rec;
  try {
    rec = new MediaRecorder(shot.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 8000000 } : {});
  } catch (err) {
    console.error('录屏开不了', err);
    flashHint('录屏开不了（这个浏览器可能不支持）');
    return;
  }
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    recorder = null;
    hide(recBadge);
    const blob = new Blob(chunks, { type: rec.mimeType || type || 'video/webm' });
    saveFile(blob, `雾镜-${timeStamp()}.${blob.type.includes('mp4') ? 'mp4' : 'webm'}`, '录屏');
  };
  rec.start(1000); // 每秒交一次数据，录很久也不会占太多内存
  recorder = rec;
  recordStart = clock;
  show(recBadge);
  flashHint('开始录屏 · 再按 R 停止');
}

// 存文件：先试着存到用户选的文件夹；不支持、没选、出错，就按普通下载存
async function saveFile(blob, name, what) {
  try {
    const dir = await getSaveDir();
    if (dir) {
      const file = await dir.getFileHandle(name, { create: true });
      const out = await file.createWritable();
      await out.write(blob);
      await out.close();
      flashHint(`${what}存好了：「${dir.name}」文件夹里的 ${name}`);
      return;
    }
  } catch (err) {
    console.warn('存到文件夹没成功，改成下载', err);
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  flashHint(`${what}存好了：在「下载」文件夹里的 ${name}`);
}

// 存到哪个文件夹：第一次弹出选文件夹的窗口（从桌面开始），以后记住；
// 下次打开页面时 Chrome 可能会问一句「允许编辑文件吗」（按 S、R 时才问）
async function getSaveDir() {
  if (!window.showDirectoryPicker) return null; // Safari 等：不支持
  if (!saveDir) saveDir = await loadDirHandle();
  if (saveDir) {
    let perm = await saveDir.queryPermission({ mode: 'readwrite' });
    if (perm === 'prompt') perm = await saveDir.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') return saveDir;
  }
  flashHint('第一次保存：在弹出的窗口里，到「桌面」新建一个文件夹（比如「雾镜作品」），选中它再点「打开」');
  saveDir = await window.showDirectoryPicker({ id: 'fog-mirror', mode: 'readwrite', startIn: 'desktop' });
  storeDirHandle(saveDir);
  return saveDir;
}

// 选过的文件夹存在浏览器的 IndexedDB 里（localStorage 存不了这种东西）
function openStore() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('fogMirror', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadDirHandle() {
  try {
    const db = await openStore();
    return await new Promise((resolve) => {
      const req = db.transaction('kv').objectStore('kv').get('saveDir');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (err) {
    return null;
  }
}

async function storeDirHandle(handle) {
  try {
    const db = await openStore();
    db.transaction('kv', 'readwrite').objectStore('kv').put(handle, 'saveDir');
  } catch (err) { /* 存不了：下次再选一次 */ }
}

function timeStamp() { // 文件名里的时间，比如 2026-10-28-14.30.12（Mac 文件名里不能用冒号）
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}.${p(d.getMinutes())}.${p(d.getSeconds())}`;
}

function formatTime(ms) { // 毫秒 → 0:12
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

// ---------- 小工具 ----------
function show(el) { el.classList.remove('hidden'); }
function hide(el) { el.classList.add('hidden'); }

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); } // 把 v 限制在 lo~hi 之间

function mean(list) { return list.reduce((a, b) => a + b, 0) / list.length; } // 平均数

function median(list) { // 中位数：从小到大排好，取中间那个
  const v = list.slice().sort((a, b) => a - b);
  return v[Math.floor(v.length / 2)];
}

function smoothstep(a, b, x) { // 在 a~b 之间从 0 平滑地过渡到 1
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function smootherstep(a, b, x) { // 和 smoothstep 一样，但两头过渡得更柔，擦痕边缘用它更顺滑
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * t * (t * (t * 6 - 15) + 10);
}

function hash2(x, y) { // 给一个整数坐标一个固定的「随机数」0~1
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function smoothNoise(x, y) { // 平滑起伏的随机图案，结果 0~1
  const xi = Math.floor(x), yi = Math.floor(y);
  const fx = x - xi, fy = y - yi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
